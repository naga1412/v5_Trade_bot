                 echo '=== latest 5 rl_checkpoints ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar \
                   -c \"SELECT id, version, is_active, activated_at FROM rl_checkpoints ORDER BY id DESC LIMIT 5;\" && \
                 echo '' && \
                 echo '=== activating latest rl_checkpoint ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar \
                   -c \"UPDATE rl_checkpoints SET is_active=FALSE, deactivated_at=NOW() \
                        WHERE model_name='ppo_policy_v1' AND is_active=TRUE;\" \
                   -c \"UPDATE rl_checkpoints SET is_active=TRUE, activated_at=NOW() \
                        WHERE id=(SELECT MAX(id) FROM rl_checkpoints WHERE model_name='ppo_policy_v1') \
                        RETURNING id, version, is_active;\" && \
                 echo '' && \
                 echo '=== restarting backend ===' && \
                 docker compose restart backend && \
                 echo '=== done — verify with checkpoints probe after 30s ==='"
              ;;
            soak-verify)
              # Phase 1+2 soak verification: checks cooldown=4h, brain_decisions,
              # pattern confidence in notes, and 7d shadow trade win rate + exit reasons.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== 1. Cooldown windows (hours_remaining from NOW; ~0-4 = normal, >0 = still active) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT symbol, timeframe, cooldown_until, \
                       ROUND(EXTRACT(EPOCH FROM (cooldown_until - NOW())) / 3600, 2) AS hours_remaining \
                     FROM shadow_cooldowns \
                     ORDER BY cooldown_until DESC LIMIT 10;\" && \
                 echo '=== 2. brain_decisions rows (last 12h; expect >0 after #288 deploy) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT COUNT(*) AS brain_decisions_12h, \
                       MIN(ts) AS earliest, MAX(ts) AS latest \
                     FROM brain_decisions WHERE ts > NOW() - INTERVAL '12h';\" && \
                 echo '=== 3. Pattern confidence in recent predictions (last 6h) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT ts, symbol, direction, \
                       ROUND(final_score::numeric, 3) AS final_score, \
                       ROUND(confidence::numeric, 3) AS conf \
                     FROM predictions \
                     WHERE ts > NOW() - INTERVAL '6h' \
                     ORDER BY ts DESC LIMIT 10;\" && \
                 echo '=== 4. Shadow trade win rate (7d) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT direction, COUNT(*) AS trades, \
                       SUM(CASE WHEN pnl_pct > 0 THEN 1 ELSE 0 END) AS wins, \
                       ROUND(100.0 * SUM(CASE WHEN pnl_pct > 0 THEN 1 ELSE 0 END) / NULLIF(COUNT(*), 0), 1) AS wr_pct, \
                       ROUND(AVG(pnl_pct)::numeric * 100, 3) AS avg_pnl_pct \
                     FROM shadow_trades \
                     WHERE closed_at >= NOW() - INTERVAL '7 days' AND closed_at IS NOT NULL \
                     GROUP BY direction ORDER BY direction;\" && \
                 echo '=== 5. Exit reason breakdown (7d; TIMEOUT should not dominate SL) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT exit_reason, COUNT(*) AS n, \
                       ROUND(AVG(pnl_pct)::numeric * 100, 3) AS avg_pnl_pct \
                     FROM shadow_trades \
                     WHERE closed_at >= NOW() - INTERVAL '7 days' AND closed_at IS NOT NULL \
                     GROUP BY exit_reason ORDER BY n DESC;\""
              ;;
          esac
