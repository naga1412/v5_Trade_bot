              # shell escaping of the SQL text is ever required. The script
              # enforces (a) SELECT / WITH only, (b) SET SESSION TRANSACTION
              # READ ONLY, (c) statement_timeout=15s, (d) 500-row fetch cap.
              #
              # `target=prod` (default) hits /opt/trading-radar backend against
              # trading_radar. `target=staging` hits /opt/trading-radar-staging
              # backend-staging against trading_radar_staging. Prod is the
              # default so nothing changes implicitly.
              if [ -z "$SQL" ]; then
                echo "ERROR: sql-select probe requires the 'sql' workflow input" >&2
                exit 2
              fi
              TARGET_DEFAULTED="${TARGET:-prod}"
              case "$TARGET_DEFAULTED" in
                prod)
                  SQL_TARGET_DIR="$DIR_DEFAULTED"
                  SQL_TARGET_COMPOSE_ARGS=""
                  SQL_TARGET_BACKEND_SVC="backend"
