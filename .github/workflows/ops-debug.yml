name: ops-debug

# Manual one-off SSH probes for forensic / triage. workflow_dispatch
# only — never runs automatically. Each probe outputs to the run log.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: which probe to run
        required: true
        default: errors
        type: choice
        options:
          - errors      # last 200 backend log lines filtered to errors
          - logs        # last 200 backend log lines unfiltered
          - tables      # row counts on universe_history + asset_universe + predictions
          - scanner     # show scanner endpoint internals (live SQL EXPLAIN + count)
          - checkpoints # ml_checkpoints + rl_checkpoints rows (is anything active?)
          - stats       # paper-trade win rate, P&L, open positions, prediction direction split
          - shadow-debug # why are zero shadow_trades being created? checks worker, thresholds, universe, errors
          - ws-probe    # one-shot direct WS test against fstream.binance.com — diagnoses silent multi-stream
          - net-probe   # DNS + TCP + HTTPS reachability test from backend container to fstream.binance.com
          - health-summary # one-page production health: container, workers, errors, recent shadow + prediction activity
          - direction-performance # LONG vs SHORT hit rate + realized pnl from prediction_validations — answers "is the model directionally accurate per side"
          - test-trade-open # fire a 20 USDT BTCUSDT LONG signal via the real dispatcher → testnet only; operator approves in Telegram
          - test-trade-close-all # market-close every open position on Binance Futures testnet
          - test-trade-verify-keys # READ-ONLY diagnostic: try the vaulted keys against testnet AND live, print Hetzner outbound IP, tell operator exactly what's wrong
          - test-trade-live-round-trip # ⚠ REAL MONEY: opens + auto-closes 0.001 BTC @ 20× on LIVE Binance (~$4 margin, ~$0.06 fees). Requires explicit operator authorization.
          - test-trade-live-close-all # SAFETY NET: market-closes any open BTCUSDT/ETHUSDT position on LIVE Binance
          - enable-live-telegram-approve # ⚠ ENABLES autonomous trading: lowers size 5-10 USDT, mode=telegram-approve, BINANCE_USE_TESTNET=false, restarts backend
          - disable-live-telegram-approve # SAFETY REVERT: back to mode=manual, sizing 20-50, BINANCE_USE_TESTNET=true, restart
          - test-trade-fully-auto-round-trip # ⚠ REAL MONEY: deterministic fully-auto test through the dispatcher → _place_live_order path. ~$5 margin, ~$0.04 fees, auto-closes
          - audit-replay-verify # READ-ONLY: re-hashes last 100 rows of each of the 7 chained tables (predictions, shadow_trades, live_trades, paper_trades, brain_decisions, mode_change_log, tax_events); reports match counts per JSONB strategy. Used to verify PR1 audit-whitelist refactor.
          - audit-history # READ-ONLY: dump auth_violations 'audit_chain_broken' rows + worker_heartbeats for audit_verifier_task. Answers "has the verifier been running, what did it find?"
          - staging-verify # READ-ONLY: hotfix #171 verification against STAGING (tr-staging-backend container, /opt/trading-radar-staging, port 8001, postgres-staging service). SELECT-only on staging DB, docker inspect, log grep — no writes, no restarts, no config changes. Operator-authorized for the hotfix #171 dev→main gate.
          - pr1-rows-spot-check # READ-ONLY: spot-check 10 most-recent predictions for PR1 analytics columns (mtf_agreement, p_win, effective_score, etc.). V5 verification.
          - live-worker-process-status # READ-ONLY: live_worker diagnostic — ps, /proc/1/status, worker_heartbeats, last 7d Binance WS + prediction logs. For investigating the predictions=0 silence since 2026-05-11.
          - brain-cron-trigger # WRITE: post-deploy verify of PR-BRAIN-BOOTSTRAP-FIX. Verifies the 3 fixes on disk, manually fires hetzner_brain_cron.sh, tails the resulting log, reports rl_checkpoints + rl-cache. Trains a checkpoint (~5-15 min CPU). Does NOT activate the checkpoint (is_active stays False).
          - brain-rl-cache-archive # WRITE: mv all *.pt + eval_brain_*.json files from rl-cache into rl-cache/_predegenerate/. Idempotent. Forces next cron to cold-start. Does NOT touch rl_checkpoints DB rows.
          - brain-holdout-labels # READ-ONLY: label-side audit of the 59 backtest holdout trades (2026-05-19 → 2026-05-22). Reports trade dump + by-direction + by-hour + top-15 by-symbol — informs misclass analysis without needing brain decisions.
          - brain-reeval-checkpoints # READ-ONLY: re-evaluates each .pt in _predegenerate/ against current buffer state using PR-BRAIN-CORRECTNESS-METRIC. Outputs a comparison table with brain_correctness, sharpe, cumulative_reward — lets us judge old checkpoints by the new (non-invariant) metric without retraining.
          - recent-perf # READ-ONLY: 30-day shadow trade win rate + avg P&L by direction + 14-day daily cadence — fresh performance snapshot replacing the stale May holdout dates in stats probe
          - brain-activate # WRITE: list rl-cache .pt files + cron log + activate latest rl_checkpoint (is_active=true) + restart backend. Use when brain has been training nightly but never activated.
          - soak-verify # Phase 1+2 soak check: cooldown=4h, brain_decisions rows, pattern confidence in notes, 7d shadow win rate + exit reasons

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      HETZNER_INSTALL_DIR: ${{ secrets.HETZNER_INSTALL_DIR }}
    steps:
      - name: Checkout (for probes that need repo files like audit-replay-verify)
        uses: actions/checkout@v4

      - name: Set up SSH
        if: env.HETZNER_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Run probe
        if: env.HETZNER_HOST != ''
        env:
          PROBE: ${{ inputs.probe }}
        run: |
          USER_DEFAULTED="${HETZNER_USER:-root}"
          DIR_DEFAULTED="${HETZNER_INSTALL_DIR:-/opt/trading-radar}"
          case "$PROBE" in
            errors)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose logs --tail=300 backend | \
                 grep -iE 'error|exception|traceback|500 internal|sqlalche\\.me' | \
                 tail -80"
              ;;
            logs)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose logs --tail=200 backend"
              ;;
            tables)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT 'universe_history' AS t, count(*) FROM universe_history \
                   UNION ALL SELECT 'asset_universe', count(*) FROM asset_universe \
                   UNION ALL SELECT 'predictions', count(*) FROM predictions \
                   UNION ALL SELECT 'shadow_trades', count(*) FROM shadow_trades \
                   UNION ALL SELECT 'live_trades', count(*) FROM live_trades;\""
              ;;
            scanner)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT user_id, timeframe, count(*), max(ts) \
                   FROM predictions GROUP BY user_id, timeframe ORDER BY 1, 2;\""
              ;;
            checkpoints)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT 'ml' AS kind, id, model_name, version, is_active, \
                    activated_at, deactivated_at, sha256 \
                    FROM ml_checkpoints ORDER BY id DESC LIMIT 10;\" -c \
                 \"SELECT 'rl' AS kind, id, model_name, version, is_active, \
                    activated_at, deactivated_at \
                    FROM rl_checkpoints ORDER BY id DESC LIMIT 10;\" && \
                 docker compose exec -T backend ls -la /app/data/ml-cache/ 2>/dev/null || true"
              ;;
            stats)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT 'paper trades closed' AS kind, count(*) AS n FROM shadow_trades WHERE closed_at IS NOT NULL \
                   UNION ALL SELECT 'paper trades open', count(*) FROM shadow_trades WHERE closed_at IS NULL \
                   UNION ALL SELECT 'live trades open', count(*) FROM live_trades WHERE closed_at IS NULL \
                   UNION ALL SELECT 'live trades closed', count(*) FROM live_trades WHERE closed_at IS NOT NULL;\" -c \
                 \"SELECT direction, count(*) AS trades, \
                    round((100.0 * sum(CASE WHEN pnl_pct > 0 THEN 1 ELSE 0 END) / nullif(count(*), 0))::numeric, 1) AS win_rate_pct, \
                    round(sum(pnl_usdt)::numeric, 2) AS total_pnl_usdt, \
                    round(avg(pnl_pct)::numeric * 100, 2) AS avg_pnl_pct \
                    FROM shadow_trades WHERE closed_at IS NOT NULL GROUP BY direction \
                    UNION ALL SELECT 'TOTAL', count(*), \
                      round((100.0 * sum(CASE WHEN pnl_pct > 0 THEN 1 ELSE 0 END) / nullif(count(*), 0))::numeric, 1), \
                      round(sum(pnl_usdt)::numeric, 2), \
                      round(avg(pnl_pct)::numeric * 100, 2) \
                    FROM shadow_trades WHERE closed_at IS NOT NULL;\" -c \
                 \"SELECT direction, count(*) AS predictions, \
                    round(avg(final_score)::numeric, 3) AS avg_score, \
                    round(avg(confidence)::numeric, 3) AS avg_conf, \
                    max(ts) AS last_seen \
                    FROM predictions WHERE ts > now() - interval '24 hours' \
                    GROUP BY direction ORDER BY direction;\" -c \
                 \"SELECT date_trunc('hour', ts) AS hour, count(*) AS predictions \
                    FROM predictions WHERE ts > now() - interval '6 hours' \
                    GROUP BY 1 ORDER BY 1 DESC LIMIT 6;\""
              ;;
            shadow-debug)
              # Why are zero shadow_trades being created? Checks the four
              # things that can prevent the shadow worker from opening
              # positions: (1) the worker isn't running / has crashed,
              # (2) asset_universe is empty so it falls back to BTCUSDT only,
              # (3) prediction scores never clear the 0.30 LONG threshold,
              # (4) the worker is opening positions but persist is failing.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== row counts (REAL open count from shadow_open_positions) ===' && \
                 docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT 'shadow_open_positions' AS t, count(*) FROM shadow_open_positions \
                   UNION ALL SELECT 'shadow_trades (closed)', count(*) FROM shadow_trades \
                   UNION ALL SELECT 'shadow_cooldowns', count(*) FROM shadow_cooldowns \
                   UNION ALL SELECT 'asset_universe (total rows)', count(*) FROM asset_universe \
                   UNION ALL SELECT 'asset_universe (latest snapshot symbols)', \
                     count(*) FROM asset_universe \
                     WHERE snapshot_at = (SELECT max(snapshot_at) FROM asset_universe);\" && \
                 echo '=== prediction score distribution (24h) — entry needs score > 0.30 LONG or < -0.50 SHORT, conf >= 0.50 ===' && \
                 docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT count(*) AS total_24h, \
                    round(min(final_score)::numeric, 3) AS min_score, \
                    round(max(final_score)::numeric, 3) AS max_score, \
                    round((percentile_cont(0.95) WITHIN GROUP (ORDER BY final_score))::numeric, 3) AS p95_score, \
                    round(min(confidence)::numeric, 3) AS min_conf, \
                    round(max(confidence)::numeric, 3) AS max_conf \
                    FROM predictions WHERE ts > now() - interval '24 hours';\" -c \
                 \"SELECT 'long-eligible (score>0.30 AND conf>=0.50)' AS gate, count(*) FROM predictions \
                    WHERE ts > now() - interval '24 hours' AND final_score > 0.30 AND confidence >= 0.50 \
                    UNION ALL SELECT 'short-eligible (score<-0.50 AND conf>=0.50)', count(*) FROM predictions \
                    WHERE ts > now() - interval '24 hours' AND final_score < -0.50 AND confidence >= 0.50 \
                    UNION ALL SELECT 'conf-blocked (score passes, conf<0.50)', count(*) FROM predictions \
                    WHERE ts > now() - interval '24 hours' AND (final_score > 0.30 OR final_score < -0.50) AND confidence < 0.50;\" && \
                 echo '=== shadow worker activity over the entire log buffer ===' && \
                 docker compose logs --tail=20000 backend 2>&1 | \
                   grep -iE 'shadow|MultiStreamReader|start_shadow|worker:' | tail -80 && \
                 echo '=== startup banner (first 80 lines of log buffer) ===' && \
                 docker compose logs --tail=20000 backend 2>&1 | head -80 && \
                 echo '=== ENV + WORKER_ENABLED that lifespan checks ===' && \
                 docker compose exec -T backend env | grep -iE '^(ENV|WORKER_ENABLED|AUTONOMOUS_TRADING_ENABLED|BINANCE)=' | sort && \
                 echo '=== container restart counts (anything > 0 = crash loop) ===' && \
                 docker inspect tr-backend --format 'restarts={{.RestartCount}} status={{.State.Status}} health={{.State.Health.Status}}'"
              ;;
            ws-probe)
              # Direct one-shot test: open a WS to fstream.binance.com from
              # inside the backend container with a 2-symbol subscription
              # (BTCUSDT + ETHUSDT — known-valid). Print the first 10 frames.
              # If this works → the bug is the 30-symbol universe contains
              # invalid streams and Binance rejects the whole sub silently.
              # If this hangs → outbound to fstream.binance.com is blocked
              # at the network layer (Hetzner firewall / DNS / etc.) and
              # the bug is below the application.
              # The script is base64-encoded so it can pass through SSH +
              # docker exec without YAML / shell quoting hell.
              # Updated 2026-05-11: prior aggTrade probe showed handshake OK
              # but ZERO frames — Binance accepts the connection then sends
              # nothing. Likely cause: regional / IP geoblock on Futures
              # market data. New script also tests SPOT WS as a control:
              # SPOT works + FUTURES doesn't = clear geoblock signal.
              # Plus dumps our public IP and ipapi.co geo info so we know
              # which Hetzner DC region we're in.
              SCRIPT_B64=''
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && timeout 60 docker compose exec -T backend python -c 'import base64; exec(base64.b64decode(\"$SCRIPT_B64\").decode())' || echo 'ws-probe killed by timeout=60s'"
              ;;
            net-probe)
              # Three quick reachability tests from inside the backend
              # container, each with a hard timeout so the probe finishes
              # in ~15s regardless. Together they isolate where the WS
              # path is failing:
              #   - DNS: getent hosts fstream.binance.com
              #   - TCP: bash /dev/tcp open to fstream.binance.com:443
              #   - HTTPS: curl -v https://fstream.binance.com/ (404 is OK)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== DNS resolution (fstream + fapi + api) ===' && \
                 docker compose exec -T backend bash -c 'getent hosts fstream.binance.com fapi.binance.com api.binance.com' && \
                 echo '=== TCP open to fstream.binance.com:443 (5s timeout) ===' && \
                 docker compose exec -T backend bash -c 'timeout 5 bash -c \"</dev/tcp/fstream.binance.com/443\" && echo TCP_OK_fstream || echo TCP_FAIL_fstream' && \
                 echo '=== TCP open to fapi.binance.com:443 (5s timeout) ===' && \
                 docker compose exec -T backend bash -c 'timeout 5 bash -c \"</dev/tcp/fapi.binance.com/443\" && echo TCP_OK_fapi || echo TCP_FAIL_fapi' && \
                 echo '=== HTTPS GET https://fstream.binance.com/ (10s timeout) ===' && \
                 docker compose exec -T backend bash -c 'curl -s -o /dev/null -m 10 -w \"http_code=%{http_code} time=%{time_total}s\\n\" https://fstream.binance.com/'"
              ;;
            pr1-rows-spot-check)
              # READ-ONLY: spot-check most-recent predictions rows for the
              # 7 PR1 analytics columns. Answers "is the aggregator hook
              # populating the new columns?" (V5 verification).
              # Wider 6h window than the operator's 2h spec because the
              # known pre-existing live_worker gap may push the most-recent
              # prediction row back; if 6h shows zero, the issue is the
              # live_worker not writing predictions, not PR1.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== last 10 predictions (any age) — PR1 analytics columns ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT id, symbol, timeframe, ts, \
                       mtf_agreement, mtf_dominant_tf, p_win, \
                       effective_score, realized_vol_20d, \
                       funding_directional_adj \
                     FROM predictions \
                     ORDER BY ts DESC LIMIT 10;\" && \
                 echo '=== prediction count in trailing windows ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT 'last 2h' AS window, count(*) FROM predictions WHERE ts > now() - interval '2 hours' \
                     UNION ALL SELECT 'last 6h', count(*) FROM predictions WHERE ts > now() - interval '6 hours' \
                     UNION ALL SELECT 'last 24h', count(*) FROM predictions WHERE ts > now() - interval '24 hours' \
                     UNION ALL SELECT 'last 7d', count(*) FROM predictions WHERE ts > now() - interval '7 days' \
                     UNION ALL SELECT 'all-time', count(*) FROM predictions;\" && \
                 echo '=== aggregator-hook column coverage (rows with each col non-null) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT \
                       count(*) FILTER (WHERE mtf_agreement IS NOT NULL) AS mtf_agreement_set, \
                       count(*) FILTER (WHERE mtf_dominant_tf IS NOT NULL) AS mtf_dominant_set, \
                       count(*) FILTER (WHERE p_win IS NOT NULL) AS p_win_set, \
                       count(*) FILTER (WHERE effective_score IS NOT NULL) AS effective_score_set, \
                       count(*) FILTER (WHERE realized_vol_20d IS NOT NULL) AS realized_vol_set, \
                       count(*) FILTER (WHERE funding_directional_adj IS NOT NULL) AS funding_adj_set, \
                       count(*) AS total_rows \
                     FROM predictions \
                     WHERE ts > now() - interval '7 days';\" && \
                 echo '=== alembic version ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT version_num FROM alembic_version;\""
              ;;
            health-summary)
              # One-page production health check: container status,
              # backend health endpoint, the 13-worker watchdog state,
              # recent error count, shadow trade activity, prediction
              # cadence. Designed to be safe to run hourly as a polling
              # monitor — every section bounded so the whole thing
              # finishes in under 30s.
              # Updated 2026-05-11: groups workers by state, treats
              # pending_heartbeat as a separate non-alarming bucket.
              WORKER_SCRIPT=''
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== container ===' && \
                 docker inspect tr-backend --format 'restarts={{.RestartCount}} status={{.State.Status}} started={{.State.StartedAt}}' && \
                 echo '=== backend /api/v1/health ===' && \
                 docker compose exec -T backend curl -s -o /dev/null -m 5 -w 'http_code=%{http_code} time=%{time_total}s\n' http://localhost:8000/api/v1/health && \
                 echo '=== workers (via watchdog check_all_workers) ===' && \
                 timeout 30 docker compose exec -T backend python -c 'import base64; exec(base64.b64decode(\"$WORKER_SCRIPT\").decode())' && \
                 echo '=== errors in last hour ===' && \
                 ERRC=\$(docker compose logs --since=1h backend 2>&1 | grep -ciE 'error|exception|traceback|500 internal' || true) && \
                 echo \"error-like log lines (last 1h): \$ERRC\" && \
                 echo '=== shadow trade activity (last 1h) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT 'open positions' AS k, count(*) FROM shadow_open_positions \
                     UNION ALL SELECT 'closed trades total', count(*) FROM shadow_trades \
                     UNION ALL SELECT 'closed trades last 1h', count(*) FROM shadow_trades WHERE closed_at > now() - interval '1 hour' \
                     UNION ALL SELECT 'opened last 1h (open + closed)', \
                       (SELECT count(*) FROM shadow_open_positions WHERE opened_at > now() - interval '1 hour') + \
                       (SELECT count(*) FROM shadow_trades WHERE opened_at > now() - interval '1 hour');\" && \
                 echo '=== predictions cadence (last 6h) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT date_trunc('hour', ts) AS hour, count(*) AS predictions, \
                       round(max(final_score)::numeric, 3) AS max_score, \
                       round(min(final_score)::numeric, 3) AS min_score \
                     FROM predictions WHERE ts > now() - interval '6 hours' \
                     GROUP BY 1 ORDER BY 1 DESC LIMIT 6;\" && \
                 echo '=== shadow signals fired in last 1h (from logs) ===' && \
                 docker compose logs --since=1h backend 2>&1 | grep -E 'shadow_worker:.*SIGNAL' | tail -10 && \
                 echo '(end)'"
              ;;
            direction-performance)
              # Read-only diagnostic. Answers: "is the model actually
              # directionally accurate, broken down by LONG vs SHORT?"
              # All queries hit prediction_validations (filled by the
              # validator worker added in PR #109) so they require at
              # least one validated row to produce output.
              #
              # The split also surfaces:
              #   - how many SHORT predictions exist at all (the 8 SHORT
              #     predictions historically averaged score=-0.103 — well
              #     above any reasonable SHORT entry gate);
              #   - whether the few SHORT predictions that DO happen are
              #     better/worse than LONG (hit rate + avg pnl_pct);
              #   - threshold-crossing counts for both the old asymmetric
              #     gate (-0.50) and the new symmetric gate (-0.30 from
              #     PR #121) so we know what flipping the threshold would
              #     have changed historically.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== prediction_validations — global summary ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT count(*) AS total_rows, \
                       count(*) FILTER (WHERE validated_at IS NOT NULL) AS validated, \
                       count(*) FILTER (WHERE was_correct) AS correct, \
                       round((100.0 * count(*) FILTER (WHERE was_correct) / nullif(count(*) FILTER (WHERE validated_at IS NOT NULL), 0))::numeric, 1) AS accuracy_pct \
                     FROM prediction_validations;\" && \
                 echo '=== accuracy by direction (validated rows only) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT direction, count(*) AS n, \
                       count(*) FILTER (WHERE was_correct) AS correct, \
                       round((100.0 * count(*) FILTER (WHERE was_correct) / nullif(count(*), 0))::numeric, 1) AS accuracy_pct, \
                       round(avg(pnl_pct)::numeric, 4) AS avg_pnl_pct, \
                       round(min(pnl_pct)::numeric, 4) AS worst_pnl, \
                       round(max(pnl_pct)::numeric, 4) AS best_pnl \
                     FROM prediction_validations WHERE validated_at IS NOT NULL \
                     GROUP BY direction ORDER BY direction;\" && \
                 echo '=== score-magnitude buckets per direction (would-be SHORT signal counts) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT \
                       count(*) AS total_predictions, \
                       count(*) FILTER (WHERE score > 0.30 AND direction = 'LONG') AS long_score_gt_0p30, \
                       count(*) FILTER (WHERE score < -0.50 AND direction = 'SHORT') AS short_score_lt_neg0p50_OLD_GATE, \
                       count(*) FILTER (WHERE score < -0.30 AND direction = 'SHORT') AS short_score_lt_neg0p30_NEW_GATE, \
                       count(*) FILTER (WHERE score < -0.20 AND direction = 'SHORT') AS short_score_lt_neg0p20_LOOSE \
                     FROM prediction_validations;\" && \
                 echo '=== hit rate by direction over last 7 days ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT direction, count(*) AS n, \
                       round((100.0 * count(*) FILTER (WHERE was_correct) / nullif(count(*), 0))::numeric, 1) AS accuracy_pct, \
                       round(avg(pnl_pct)::numeric, 4) AS avg_pnl_pct \
                     FROM prediction_validations \
                     WHERE validated_at IS NOT NULL AND validated_at > now() - interval '7 days' \
                     GROUP BY direction ORDER BY direction;\" && \
                 echo '=== closed shadow trades — actual P&L by direction ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT direction, count(*) AS trades, \
                       count(*) FILTER (WHERE pnl_pct > 0) AS wins, \
                       round((100.0 * count(*) FILTER (WHERE pnl_pct > 0) / nullif(count(*), 0))::numeric, 1) AS win_rate_pct, \
                       round(sum(pnl_usdt)::numeric, 2) AS total_pnl_usdt, \
                       round(avg(pnl_pct)::numeric, 4) AS avg_pnl_pct, \
                       close_reason \
                     FROM shadow_trades WHERE closed_at IS NOT NULL \
                     GROUP BY direction, close_reason ORDER BY direction, close_reason;\""
              ;;
            test-trade-open)
              # Fires the same dispatch the /admin/test-trade/open endpoint
              # would fire, but from inside the backend container so we
              # bypass Cloudflare Access auth. Hard-coded for safety:
              #   use_testnet=True, mode=telegram-approve, BTCUSDT LONG, 20 USDT.
              # The dispatcher sends a Telegram message with Approve/Reject
              # buttons; the operator taps Approve and the existing
              # telegram_poller_task places the order on Binance Futures
              # testnet. No real money can be touched from this code path.
              # Script lives in host-tools/ so the YAML stays clean.
