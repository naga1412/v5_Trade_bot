name: ops-debug

# Manual one-off SSH probes for forensic / triage. workflow_dispatch
# only — never runs automatically. Each probe outputs to the run log.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: which probe to run
        required: true
        default: errors
        type: choice
        options:
          - errors      # last 200 backend log lines filtered to errors
          - logs        # last 200 backend log lines unfiltered
          - tables      # row counts on universe_history + asset_universe + predictions
          - scanner     # show scanner endpoint internals (live SQL EXPLAIN + count)
          - checkpoints # ml_checkpoints + rl_checkpoints rows (is anything active?)
          - stats       # paper-trade win rate, P&L, open positions, prediction direction split
          - shadow-debug # why are zero shadow_trades being created? checks worker, thresholds, universe, errors
          - ws-probe    # one-shot direct WS test against fstream.binance.com — diagnoses silent multi-stream
          - net-probe   # DNS + TCP + HTTPS reachability test from backend container to fstream.binance.com
          - health-summary # one-page production health: container, workers, errors, recent shadow + prediction activity
          - direction-performance # LONG vs SHORT hit rate + realized pnl from prediction_validations — answers "is the model directionally accurate per side"
          - test-trade-open # fire a 20 USDT BTCUSDT LONG signal via the real dispatcher → testnet only; operator approves in Telegram
          - test-trade-close-all # market-close every open position on Binance Futures testnet
          - test-trade-verify-keys # READ-ONLY diagnostic: try the vaulted keys against testnet AND live, print Hetzner outbound IP, tell operator exactly what's wrong
          - test-trade-live-round-trip # ⚠ REAL MONEY: opens + auto-closes 0.001 BTC @ 20× on LIVE Binance (~$4 margin, ~$0.06 fees). Requires explicit operator authorization.
          - test-trade-live-close-all # SAFETY NET: market-closes any open BTCUSDT/ETHUSDT position on LIVE Binance
          - enable-live-telegram-approve # ⚠ ENABLES autonomous trading: lowers size 5-10 USDT, mode=telegram-approve, BINANCE_USE_TESTNET=false, restarts backend
          - disable-live-telegram-approve # SAFETY REVERT: back to mode=manual, sizing 20-50, BINANCE_USE_TESTNET=true, restart
          - test-trade-fully-auto-round-trip # ⚠ REAL MONEY: deterministic fully-auto test through the dispatcher → _place_live_order path. ~$5 margin, ~$0.04 fees, auto-closes
          - audit-replay-verify # READ-ONLY: re-hashes last 100 rows of each of the 7 chained tables (predictions, shadow_trades, live_trades, paper_trades, brain_decisions, mode_change_log, tax_events); reports match counts per JSONB strategy. Used to verify PR1 audit-whitelist refactor.
          - audit-history # READ-ONLY: dump auth_violations 'audit_chain_broken' rows + worker_heartbeats for audit_verifier_task. Answers "has the verifier been running, what did it find?"
          - staging-verify # READ-ONLY: deploy health verification. FIX 2026-08-05 — was hardcoded to STAGING regardless of the TARGET input, creating false confidence in prod checks; now genuinely branches on `target` (default `staging`, pass `target=prod` for a real post-main-deploy check). SELECT-only, docker inspect, log grep — no writes, no restarts, no config changes.
          - pr1-rows-spot-check # READ-ONLY: spot-check 10 most-recent predictions for PR1 analytics columns (mtf_agreement, p_win, effective_score, etc.). V5 verification.
          - live-trade-pnl-verify # READ-ONLY: TIER 1 defect-sweep verification (2026-08-06). live_trades.pnl_usdt/pnl_pct were never written by any close path — 100%-coverage assertion, not the healer's statistical constant-detector (which needs n>=100 to even engage, useless at real live-trade volume). Flags every closed row with a known exit_price but NULL pnl as a hard violation. Permanent on-demand check — safe to re-run after every deploy that touches live_exit_monitor.py or liquidation_monitor.py.
          - live-worker-process-status # READ-ONLY: live_worker diagnostic — ps, /proc/1/status, worker_heartbeats, last 7d Binance WS + prediction logs. For investigating the predictions=0 silence since 2026-05-11.
          - pwin-calibration-report # fit clean isotonic p_win model (SHADOW_SPOT_BLACKLIST excluded) + decile calibration table on newest-20% val window (per direction)
          - brain-cron-trigger # WRITE: post-deploy verify of PR-BRAIN-BOOTSTRAP-FIX. Verifies the 3 fixes on disk, manually fires hetzner_brain_cron.sh, tails the resulting log, reports rl_checkpoints + rl-cache. Trains a checkpoint (~5-15 min CPU). Does NOT activate the checkpoint (is_active stays False).
          - brain-nan-stablecoin-repro # READ-ONLY (train_ppo runs in-memory, nothing written to rl_checkpoints): direct test of the stablecoin-pair NaN hypothesis from the 2026-08-05 03:30 UTC divergence (USD1USDT named in the failing batch). Runs train_ppo TWICE on the real closed-trade replay buffer, seed=42 cold-start both times — once unfiltered (reproduces the exact cron scenario), once with stablecoin-pair transitions excluded via the already-deployed is_stablecoin_pair helper. Script is base64-embedded and piped via stdin, no new file needed in the container — works from any ref. ~2-10 min CPU.
          - brain-nan-warmstart-repro # READ-ONLY: follow-up to brain-nan-stablecoin-repro after cold-start (both filtered and unfiltered) succeeded cleanly, contradicting a pure bad-data theory. Warm-starts from the SAME .pt file hetzner_brain_cron.sh's `ls -t | head -n1` would pick for tonight's run (the file every one of the 12 consecutive failed nights has warm-started from, since a failed run never reaches the save step to advance it), then runs train_ppo twice — full data, then stablecoin-filtered — to isolate whether the warm-started weights themselves are the trigger. Read-only, in-memory, nothing written to rl_checkpoints.
          - brain-sharpe-diagnosis # READ-ONLY: analyzes the most-recent eval_brain_*_per_trade.json sidecar already on disk (no new training run). Computes Sharpe on raw_reward (what a NEUTRAL brain, brain_adjust=1.0 always, would score) alongside the actual synthetic_reward Sharpe already in rl_checkpoints.eval_results — the only reference point that makes the -6.9..-9.76 range interpretable. Also prints the exact sqrt(n_holdout) scaling factor so cross-checkpoint comparisons with different holdout sizes can be sanity-checked. Diagnosis only — does not touch the metric or promotion gate.
          - brain-rl-cache-archive # WRITE: mv all *.pt + eval_brain_*.json files from rl-cache into rl-cache/_predegenerate/. Idempotent. Forces next cron to cold-start. Does NOT touch rl_checkpoints DB rows.
          - brain-holdout-labels # READ-ONLY: label-side audit of the 59 backtest holdout trades (2026-05-19 → 2026-05-22). Reports trade dump + by-direction + by-hour + top-15 by-symbol — informs misclass analysis without needing brain decisions.
          - brain-reeval-checkpoints # READ-ONLY: re-evaluates each .pt in _predegenerate/ against current buffer state using PR-BRAIN-CORRECTNESS-METRIC. Outputs a comparison table with brain_correctness, sharpe, cumulative_reward — lets us judge old checkpoints by the new (non-invariant) metric without retraining.
          - brain-cron-log # READ-ONLY: tail last 60 lines of /var/log/trading-radar-brain-cron.log on the host (outside Docker). Returns the cron's last run — Sharpe, win_rate, checkpoint id registered.
          - shadow-allow-shorts-enable # WRITE: flip SHADOW_ALLOW_SHORTS=true in .env, recreate backend (up -d). Verifies both SHADOW_ALLOW_SHORTS and DISABLE_SHORT_SIGNALS after restart. Requires operator authorization. Does NOT touch any other .env variable.
          - stablecoin-hygiene # READ-ONLY: (a) stablecoin symbol activity in shadow_trades/shadow_open_positions post-2026-07-11, (b) low-ATR sweep (avg ATR% <0.05 = flag for blacklist), (c) current SHADOW_SPOT_BLACKLIST + MIN_ENTRY_SCORE_LONG
          - pwin-threshold-whatif # READ-ONLY: CLEAN p_win threshold what-if grid (blacklist excluded, in-memory refit): lower-bound T in {0.24..0.30}, window [T, 0.35], top-decile-excluded variants + model inversion (min entry_score where pred_p_win>=0.26).
          - mfe-mae-curve # READ-ONLY: Phase 1 MFE study — fetches 1h Binance klines per LONG shadow_trade (entry_score>=0.36, 60d, blacklist excluded, top-20 at time-of-trade + ranks_21_30 for comparison). Computes MFE_R / MAE_R per trade; per TP_R in {0.5..2.0} reports implied_WR, expectancy_R, after-fee variant + SL-near-miss autopsy. ~5min runtime.
          - shadow-variant-rolling-report # READ-ONLY: paired-Δ analysis on shadow_trade_variants (Amendment 3 breakeven lane). Per (variant_name, cohort=atr_bound|cap_bound|aggregate, timeframe, window in {7,30,60,90}d): n_paired, n_armed, share_armed, mean paired Δ_gross ± SE. Also prints per-cohort DECISION rule (PASS/FAIL/NOT-YET-N at n>=100) + EARLY directional read at n>=30 + leader trigger. Filters: direction=LONG, entry_score>=0.36, blacklist excluded, top-20 rank at trade-open (BTCUSDT exempt). Δ_after_fee asserted == Δ_gross (paired fees cancel; divergence flagged as BUG).
          - settings-check # READ-ONLY: print selected Settings values from the RUNNING backend container (LIVE_COOLDOWN_ENABLED, SHADOW_TIMEFRAMES, MIN_ENTRY_SCORE_LONG, etc.) — verifies deployed env vs code defaults per operator's 2026-07-30 rule "never state env-gated behavior from a config.py default."
          - sl-autopsy # READ-ONLY: SL distance / ATR ratio analysis for closed LONG shadow_trades last 30d. Per-symbol + overall avg sl_dist%, avg_atr%, sl_atr_ratio distribution for SL-exit vs TP-exit. Answers: are stops inside the noise band?
          - recent-perf # READ-ONLY: 30-day shadow trade win rate + avg P&L by direction + 14-day daily cadence — fresh performance snapshot replacing the stale May holdout dates in stats probe
          - brain-activate # WRITE: list rl-cache .pt files + cron log + activate latest rl_checkpoint (is_active=true) + restart backend. Use when brain has been training nightly but never activated.
          - soak-verify # Phase 1+2 soak check: cooldown=4h, brain_decisions rows, pattern confidence in notes, 7d shadow win rate + exit reasons
          - top-decile-anomaly # READ-ONLY: compares extreme (entry_score>=0.445) vs high (0.36-0.445) vs below (<0.36) LONG bands — WR, avg_pnl, symbol/hour/layer distributions + score/pnl correlation. Tests momentum-exhaustion hypothesis for top-decile reversal.
          - universe-anomaly # READ-ONLY: checks non-standard symbols in asset_universe, 币安人生USDT first/last appearance, orphan symbols in shadow_trades, live Binance top-100 for non-ASCII USDT tickers.
          - signal-lookup # READ-ONLY: (1) 4-value config check (MIN_ENTRY_SCORE_LONG, SHADOW_IGNORE_MIN_SCORE, SHADOW_ALLOW_SHORTS, DISABLE_SHORT_SIGNALS), (2) backend container start time (env-flip proxy), (3) lookup a shadow trade by signal_id + recent TRXUSDT predictions.
          - sql-select # READ-ONLY: run one SELECT / WITH statement from the `sql` input against prod Postgres via the backend container. Enforced read-only at 3 layers (shape check, SET SESSION TRANSACTION READ ONLY, statement_timeout=15s). Row cap 500. See backend/scripts/sql_select_probe.py.
          - healer-status # READ-ONLY: current + last-24h healer findings summary (Phase 0). Groups by detector_name, severity + shows the 10 most-recent rows for triage.
          - healer-selftest # SENDS one synthetic [SELFTEST]-tagged CRITICAL alert through the full alert_routing chain (Telegram > SMTP > log). Operator confirms physical Telegram receipt on their phone — the acceptance test for healer Phase 0 alerting. Also records one healer_findings row so healer-status shows when it last ran.
          - healer-c1-selftest # TIER 2b defect-sweep fix (2026-08-06). C1 (dispatch-error monitor) had ZERO rows ever in healer_known_error_types — its alarm path had never been proven to fire. Injects a synthetic, uniquely-named dispatch exception via the real record_dispatch_error, runs the real C1 detector against it, and confirms it classifies as NEVER-BEFORE-SEEN + fires a critical alert through the real alert_routing chain (operator confirms physical Telegram receipt, same acceptance test as healer-selftest). Permanent on-demand canary — a fresh exception type every run, so it proves itself again on every future run, not just once.
          - regime-live-check # READ-ONLY: BUG 1 diagnostic — reports the live process's regime cache state, attempts a FRESH BTCUSDT daily-kline fetch + classification (isolates fetch-failure vs cache-never-persists vs genuine neutral), and prints REGIME_GATE_ENABLED/ADX_GATE_ENABLED's deployed values.
          - prod-restart-only # WRITE, PROD ONLY: bare `docker compose restart backend` — no .env change, no DB write. Every other restart-capable probe bundles a real config/state change with its restart; this is the isolated restart lever for verification runs (e.g. confirming migration 0040 / PR #516's 5 analytics columns round-trip through a real restart). Reports RestartCount + StartedAt before/after.
          - liquidity-floor-depth-sensitivity # READ-ONLY: is the current $50k depth floor too strict for a ~$200-500 operator order size? Sweeps the depth threshold (50k/25k/10k/5k) while holding qvol ($20M) and spread (5bps) fixed, over the same real full USDT-M perpetual market check_liquidity/live_fleet_universe candidate-selection logic uses. Methodology matches the 2026-08-15 liquidity-floor-selector decision record exactly (3 samples/candidate, ~4s apart, stable-pass/borderline/stable-fail classification) so the $50k-tier numbers are directly comparable to that decision's reference table (total/spot-backed/futures-only). Also computes REAL order-book-walk price impact for a $500 market order (both buy and sell side) from the same real depth snapshots, bucketed by measured depth — not a synthetic formula, though a simple order_usdt/depth_usdt cross-check is printed too. Explicitly reports what this CANNOT measure: fast-move/stressed-book depth, which does not scale down with order size the way calm-book impact does. Does not change any threshold — measurement only, per operator's explicit instruction. Pure Binance Futures + Spot REST reads, no DB, no writes. ~3-6 min (100+ candidates x 3 samples).
          - layer-value-isolation # READ-ONLY: isolates each scoring layer's actual value on closed LONG shadow_trades (60d + 90d, entry_score>=0.36, blacklist excluded, top-20 rank at trade-open, atr_bound cohort -- exact population convention from backend/scripts/mfe_mae_curve.py). Per live layer (L1/L2/L3/L4/L5/L9 -- L6/L8 abstain heavily, L7/L10 are permanent stubs and excluded entirely), buckets trades by that layer's signed score at entry into strong (|score|>=0.5) / weak / abstained, reporting n/WR/avg_pnl_pct/SE per bucket -- does a strong reading actually predict a better outcome, and which layers carry the signal vs which are noise. Also reports each layer's abstain rate, and (90d only) the top 10 L2 patterns by fire count with pattern_stats' STORED assumed accuracy vs the ACTUAL observed win rate in this population, side by side. Measurement only -- no weighting or code changes. Pure DB reads, no writes. Runs in seconds.
          - direction-calibration-retrospective # READ-ONLY: 2026-08-20 layer audit item 1 -- measure BEFORE wiring app.core.scoring.calibration into any live call site (it is currently unused, present in the aggregator's signature but never called). Operator's PRE-COMMITTED decision rule (set before results were seen): wire it only if avg_pnl_pct improves materially on SURVIVES vs today's population AND surviving volume stays usable; do NOT wire if expectancy is roughly unchanged and only volume falls (gate change wearing a calibration costume -- MIN_ENTRY_SCORE_LONG already does that); do NOT wire if the multiplier is near-static across historical recompute points (part d) -- a constant is not a calibration. (a) Calls the REAL compute_calibration_for_predictor() directly against prod -- reports the multiplier it would return RIGHT NOW for LONG/SHORT/NEUTRAL, plus the underlying avg_pnl_pct and sample count in its 50-row-per-direction lookback window (not the full prediction_validations table size). (b) Applies that multiplier retrospectively to the last 90d of LONG+SHORT shadow_trades signals clearing today's +-0.36 gate (blacklist excluded): score distribution shift, how many still clear the gate, WR/avg_pnl_pct WITH n AND SE for the surviving vs full population. (c) THE DECIDING QUESTION -- compares the DROPPED subset (clears today, wouldn't after calibration) against SURVIVES, gap tested against 2x combined SE: inside the error bar defaults to gate-change-costume per the pre-committed rule, not a coin-flip read. Also checks for newly-qualifying signals on any amplified side. (d) STABILITY CHECK -- recomputes the multiplier at 6 historical checkpoints across the 90d window (same real lookback logic, bounded to validated_at<=checkpoint); flags near-static (range<0.05) series as DO NOT WIRE. Pure DB reads, no writes, no code change. Runs in seconds.
          - phase4-universe-discrepancy-check # READ-ONLY, STAGING-ONLY: 2026-08-20 -- verifies why staging live_fleet_universe carries 73 symbols against the 2026-08-15 ratified measurement of 42 (34 spot-backed + 8 futures-only). (a) prints QVOL_FLOOR_USDT/SPREAD_MAX_BPS/DEPTH_FLOOR_USDT imported directly from app.data.futures_liquidity against the ratified values. (b)/(c) re-measures every symbol in the current snapshot against the ORIGINAL 3-sample/~4s-apart/stable_pass=3-of-3 methodology (not the shipped selector's own 5-sample/3-of-5-entry/unanimous-exit hysteresis), using the real check_liquidity function -- classifies stable_pass / borderline / stable_fail per symbol, broken down by cohort. (d) cross-references against get_open_position_symbols (the real function the selector's own retention override uses) to separate open-position-protected exceptions from unexplained over-admission. (e) 2026-08-20 addition: reuses the same 3 real samples to report how many of the current universe would trip the new fast-exit severity trigger (depth<50% floor OR spread>2x max, imported directly from app.shadow.live_fleet_universe's SEVERE_DEPTH_RATIO/SEVERE_SPREAD_RATIO) -- flags which of those are open-position-protected. Always targets staging (prod has no live_fleet_universe table yet -- Phase 4 hasn't been cherry-picked to main). Ignores TARGET input. ~5-8 min (73 symbols x 3 samples x ~4s gaps + real API latency).
          - layer-value-isolation-followup # READ-ONLY: follow-up to layer-value-isolation's results. (1c) Retrospective pattern_stats simulation using the REAL app/ml/patterns.py writer's exact population + exit_reason='TAKE_PROFIT' correctness definition, for the same top-10 pattern_ids -- what the table WOULD show if the write path were fixed, vs the flat 0.5 default it's stuck on. Does NOT write to pattern_stats. (2) IN-SAMPLE layer-contribution variant simulation (L2-only / L2+L1 / all-current-control / minus-noise-layers) on static score only (pre-brain_adjust/trap/news, which are identical across variants) -- reports n_signals/WR/avg_pnl/SE per variant, explicitly caveated as in-sample and not a shipping signal. (3) For the shared-abstain-gate subset (L1-L5 all None simultaneously), reports entry_score distribution, which of L6/L7/L8/L9/L10 are actually present, and the subset's own outcome stats -- what are these trades actually scored on. Measurement only, no code/weighting changes. Pure DB reads, no writes. Runs in seconds.
      sql:
        description: SQL for the sql-select probe (SELECT or WITH only, single statement, 15s timeout, 500-row cap). Ignored by every other probe.
        required: false
        default: ''
        type: string
      target:
        description: sql-select target — 'prod' (default) hits /opt/trading-radar backend against trading_radar; 'staging' hits /opt/trading-radar-staging backend-staging against trading_radar_staging. Ignored by every other probe.
        required: false
        default: prod
        type: choice
        options:
          - prod
          - staging

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      HETZNER_INSTALL_DIR: ${{ secrets.HETZNER_INSTALL_DIR }}
    steps:
      - name: Checkout (for probes that need repo files like audit-replay-verify)
        uses: actions/checkout@v4

      - name: Set up SSH
        if: env.HETZNER_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Run probe
        if: env.HETZNER_HOST != ''
        env:
          PROBE: ${{ inputs.probe }}
          SQL: ${{ inputs.sql }}
          TARGET: ${{ inputs.target }}
        run: |
          USER_DEFAULTED="${HETZNER_USER:-root}"
          DIR_DEFAULTED="${HETZNER_INSTALL_DIR:-/opt/trading-radar}"
          case "$PROBE" in
            errors)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose logs --tail=300 backend | \
                 grep -iE 'error|exception|traceback|500 internal|sqlalche\\.me' | \
                 tail -80"
              ;;
            logs)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose logs --tail=200 backend"
              ;;
            tables)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT 'universe_history' AS t, count(*) FROM universe_history \
                   UNION ALL SELECT 'asset_universe', count(*) FROM asset_universe \
                   UNION ALL SELECT 'predictions', count(*) FROM predictions \
                   UNION ALL SELECT 'shadow_trades', count(*) FROM shadow_trades \
                   UNION ALL SELECT 'live_trades', count(*) FROM live_trades;\""
              ;;
            scanner)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT user_id, timeframe, count(*), max(ts) \
                   FROM predictions GROUP BY user_id, timeframe ORDER BY 1, 2;\""
              ;;
            checkpoints)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT 'ml' AS kind, id, model_name, version, is_active, \
                    activated_at, deactivated_at, sha256 \
                    FROM ml_checkpoints ORDER BY id DESC LIMIT 10;\" -c \
                 \"SELECT 'rl' AS kind, id, model_name, version, is_active, \
                    activated_at, deactivated_at \
                    FROM rl_checkpoints ORDER BY id DESC LIMIT 10;\" && \
                 docker compose exec -T backend ls -la /app/data/ml-cache/ 2>/dev/null || true"
              ;;
            stats)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT 'paper trades closed' AS kind, count(*) AS n FROM shadow_trades WHERE closed_at IS NOT NULL \
                   UNION ALL SELECT 'paper trades open', count(*) FROM shadow_trades WHERE closed_at IS NULL \
                   UNION ALL SELECT 'live trades open', count(*) FROM live_trades WHERE status = 'open' \
                   UNION ALL SELECT 'live trades closed', count(*) FROM live_trades WHERE status = 'closed';\" -c \
                 \"SELECT direction, count(*) AS trades, \
                    round((100.0 * sum(CASE WHEN pnl_pct > 0 THEN 1 ELSE 0 END) / nullif(count(*), 0))::numeric, 1) AS win_rate_pct, \
                    round(sum(pnl_usdt)::numeric, 2) AS total_pnl_usdt, \
                    round(avg(pnl_pct)::numeric * 100, 2) AS avg_pnl_pct \
                    FROM shadow_trades WHERE closed_at IS NOT NULL GROUP BY direction \
                    UNION ALL SELECT 'TOTAL', count(*), \
                      round((100.0 * sum(CASE WHEN pnl_pct > 0 THEN 1 ELSE 0 END) / nullif(count(*), 0))::numeric, 1), \
                      round(sum(pnl_usdt)::numeric, 2), \
                      round(avg(pnl_pct)::numeric * 100, 2) \
                    FROM shadow_trades WHERE closed_at IS NOT NULL;\" -c \
                 \"SELECT direction, count(*) AS predictions, \
                    round(avg(final_score)::numeric, 3) AS avg_score, \
                    round(avg(confidence)::numeric, 3) AS avg_conf, \
                    max(ts) AS last_seen \
                    FROM predictions WHERE ts > now() - interval '24 hours' \
                    GROUP BY direction ORDER BY direction;\" -c \
                 \"SELECT date_trunc('hour', ts) AS hour, count(*) AS predictions \
                    FROM predictions WHERE ts > now() - interval '6 hours' \
                    GROUP BY 1 ORDER BY 1 DESC LIMIT 6;\""
              ;;
            shadow-debug)
              # Why are zero shadow_trades being created? Checks the four
              # things that can prevent the shadow worker from opening
              # positions: (1) the worker isn't running / has crashed,
              # (2) asset_universe is empty so it falls back to BTCUSDT only,
              # (3) prediction scores never clear the 0.30 LONG threshold,
              # (4) the worker is opening positions but persist is failing.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== row counts (REAL open count from shadow_open_positions) ===' && \
                 docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT 'shadow_open_positions' AS t, count(*) FROM shadow_open_positions \
                   UNION ALL SELECT 'shadow_trades (closed)', count(*) FROM shadow_trades \
                   UNION ALL SELECT 'shadow_cooldowns', count(*) FROM shadow_cooldowns \
                   UNION ALL SELECT 'asset_universe (total rows)', count(*) FROM asset_universe \
                   UNION ALL SELECT 'asset_universe (latest snapshot symbols)', \
                     count(*) FROM asset_universe \
                     WHERE snapshot_at = (SELECT max(snapshot_at) FROM asset_universe);\" && \
                 echo '=== prediction score distribution (24h) — entry needs score > 0.30 LONG or < -0.50 SHORT, conf >= 0.50 ===' && \
                 docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT count(*) AS total_24h, \
                    round(min(final_score)::numeric, 3) AS min_score, \
                    round(max(final_score)::numeric, 3) AS max_score, \
                    round((percentile_cont(0.95) WITHIN GROUP (ORDER BY final_score))::numeric, 3) AS p95_score, \
                    round(min(confidence)::numeric, 3) AS min_conf, \
                    round(max(confidence)::numeric, 3) AS max_conf \
                    FROM predictions WHERE ts > now() - interval '24 hours';\" -c \
                 \"SELECT 'long-eligible (score>0.30 AND conf>=0.50)' AS gate, count(*) FROM predictions \
                    WHERE ts > now() - interval '24 hours' AND final_score > 0.30 AND confidence >= 0.50 \
                    UNION ALL SELECT 'short-eligible (score<-0.50 AND conf>=0.50)', count(*) FROM predictions \
                    WHERE ts > now() - interval '24 hours' AND final_score < -0.50 AND confidence >= 0.50 \
                    UNION ALL SELECT 'conf-blocked (score passes, conf<0.50)', count(*) FROM predictions \
                    WHERE ts > now() - interval '24 hours' AND (final_score > 0.30 OR final_score < -0.50) AND confidence < 0.50;\" && \
                 echo '=== shadow worker activity over the entire log buffer ===' && \
                 docker compose logs --tail=20000 backend 2>&1 | \
                   grep -iE 'shadow|MultiStreamReader|start_shadow|worker:' | tail -80 && \
                 echo '=== startup banner (first 80 lines of log buffer) ===' && \
