name: ops-debug

# Manual one-off SSH probes for forensic / triage. workflow_dispatch
# only — never runs automatically. Each probe outputs to the run log.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: which probe to run
        required: true
        default: errors
        type: choice
        options:
          - errors      # last 200 backend log lines filtered to errors
          - logs        # last 200 backend log lines unfiltered
          - tables      # row counts on universe_history + asset_universe + predictions
          - scanner     # show scanner endpoint internals (live SQL EXPLAIN + count)
          - checkpoints # ml_checkpoints + rl_checkpoints rows (is anything active?)
          - stats       # paper-trade win rate, P&L, open positions, prediction direction split
          - shadow-debug # why are zero shadow_trades being created? checks worker, thresholds, universe, errors
          - ws-probe    # one-shot direct WS test against fstream.binance.com — diagnoses silent multi-stream
          - net-probe   # DNS + TCP + HTTPS reachability test from backend container to fstream.binance.com
          - health-summary # one-page production health: container, workers, errors, recent shadow + prediction activity
          - direction-performance # LONG vs SHORT hit rate + realized pnl from prediction_validations — answers "is the model directionally accurate per side"
          - test-trade-open # fire a 20 USDT BTCUSDT LONG signal via the real dispatcher → testnet only; operator approves in Telegram
          - test-trade-close-all # market-close every open position on Binance Futures testnet
          - test-trade-verify-keys # READ-ONLY diagnostic: try the vaulted keys against testnet AND live, print Hetzner outbound IP, tell operator exactly what's wrong
          - test-trade-live-round-trip # ⚠ REAL MONEY: opens + auto-closes 0.001 BTC @ 20× on LIVE Binance (~$4 margin, ~$0.06 fees). Requires explicit operator authorization.
          - test-trade-live-close-all # SAFETY NET: market-closes any open BTCUSDT/ETHUSDT position on LIVE Binance
          - enable-live-telegram-approve # ⚠ ENABLES autonomous trading: lowers size 5-10 USDT, mode=telegram-approve, BINANCE_USE_TESTNET=false, restarts backend
          - disable-live-telegram-approve # SAFETY REVERT: back to mode=manual, sizing 20-50, BINANCE_USE_TESTNET=true, restart
          - test-trade-fully-auto-round-trip # ⚠ REAL MONEY: deterministic fully-auto test through the dispatcher → _place_live_order path. ~$5 margin, ~$0.04 fees, auto-closes
          - audit-replay-verify # READ-ONLY: re-hashes last 100 rows of each of the 7 chained tables (predictions, shadow_trades, live_trades, paper_trades, brain_decisions, mode_change_log, tax_events); reports match counts per JSONB strategy. Used to verify PR1 audit-whitelist refactor.
          - audit-history # READ-ONLY: dump auth_violations 'audit_chain_broken' rows + worker_heartbeats for audit_verifier_task. Answers "has the verifier been running, what did it find?"
          - staging-verify # READ-ONLY: deploy health verification. FIX 2026-08-05 — was hardcoded to STAGING regardless of the TARGET input, creating false confidence in prod checks; now genuinely branches on `target` (default `staging`, pass `target=prod` for a real post-main-deploy check). SELECT-only, docker inspect, log grep — no writes, no restarts, no config changes.
          - pr1-rows-spot-check # READ-ONLY: spot-check 10 most-recent predictions for PR1 analytics columns (mtf_agreement, p_win, effective_score, etc.). V5 verification.
          - live-trade-pnl-verify # READ-ONLY: TIER 1 defect-sweep verification (2026-08-06). live_trades.pnl_usdt/pnl_pct were never written by any close path — 100%-coverage assertion, not the healer's statistical constant-detector (which needs n>=100 to even engage, useless at real live-trade volume). Flags every closed row with a known exit_price but NULL pnl as a hard violation. Permanent on-demand check — safe to re-run after every deploy that touches live_exit_monitor.py or liquidation_monitor.py.
          - live-worker-process-status # READ-ONLY: live_worker diagnostic — ps, /proc/1/status, worker_heartbeats, last 7d Binance WS + prediction logs. For investigating the predictions=0 silence since 2026-05-11.
          - pwin-calibration-report # fit clean isotonic p_win model (SHADOW_SPOT_BLACKLIST excluded) + decile calibration table on newest-20% val window (per direction)
          - brain-cron-trigger # WRITE: post-deploy verify of PR-BRAIN-BOOTSTRAP-FIX. Verifies the 3 fixes on disk, manually fires hetzner_brain_cron.sh, tails the resulting log, reports rl_checkpoints + rl-cache. Trains a checkpoint (~5-15 min CPU). Does NOT activate the checkpoint (is_active stays False).
          - brain-nan-stablecoin-repro # READ-ONLY (train_ppo runs in-memory, nothing written to rl_checkpoints): direct test of the stablecoin-pair NaN hypothesis from the 2026-08-05 03:30 UTC divergence (USD1USDT named in the failing batch). Runs train_ppo TWICE on the real closed-trade replay buffer, seed=42 cold-start both times — once unfiltered (reproduces the exact cron scenario), once with stablecoin-pair transitions excluded via the already-deployed is_stablecoin_pair helper. Script is base64-embedded and piped via stdin, no new file needed in the container — works from any ref. ~2-10 min CPU.
          - brain-nan-warmstart-repro # READ-ONLY: follow-up to brain-nan-stablecoin-repro after cold-start (both filtered and unfiltered) succeeded cleanly, contradicting a pure bad-data theory. Warm-starts from the SAME .pt file hetzner_brain_cron.sh's `ls -t | head -n1` would pick for tonight's run (the file every one of the 12 consecutive failed nights has warm-started from, since a failed run never reaches the save step to advance it), then runs train_ppo twice — full data, then stablecoin-filtered — to isolate whether the warm-started weights themselves are the trigger. Read-only, in-memory, nothing written to rl_checkpoints.
          - brain-sharpe-diagnosis # READ-ONLY: analyzes the most-recent eval_brain_*_per_trade.json sidecar already on disk (no new training run). Computes Sharpe on raw_reward (what a NEUTRAL brain, brain_adjust=1.0 always, would score) alongside the actual synthetic_reward Sharpe already in rl_checkpoints.eval_results — the only reference point that makes the -6.9..-9.76 range interpretable. Also prints the exact sqrt(n_holdout) scaling factor so cross-checkpoint comparisons with different holdout sizes can be sanity-checked. Diagnosis only — does not touch the metric or promotion gate.
          - own-trade-entry-timing # READ-ONLY: samples the 100 most-recent winning LONG shadow_trades, fetches real Binance SPOT klines +/-72h around each entry, finds the local low before entry and the eventual peak after, reports median bars-late (local-low -> entry) and median % of the low->peak move captured from entry onward. Item 3(d) of the leading-indicators research. Pure REST reads (Binance + our own DB), no writes.
          - part3-entry-timing-all-trades # READ-ONLY: exact reproduction of the operator's original Part 3 methodology (entry_score>=0.36, LONG, 60d, top-20 rank at trade-open, atr_bound cohort, stablecoin blacklist excluded, ALL trades not just winners), native-TF bars (15m trades on 15m, 1h on 1h), 96-bar pre-window, captured_fraction=(peak-entry)/(peak-pre_move_low). Reports full percentile/bucket breakdown plus a winners-vs-losers capture-fraction decomposition. Pure REST + read-only DB, no writes.
          - movers-vs-control-flow-signals # READ-ONLY: item 3(c) movers-vs-control separation test. Universe = top-40 Binance Futures USDT perps by 24h quoteVolume (NOT the shadow universe, to avoid its momentum-preselection bias), stablecoins excluded. Fresh "mover" definition (the original 149-mover dataset isn't reproducible): per-symbol self-relative threshold on 24h forward |return| vs that symbol's own 30d median (>=2x median = mover, <=0.5x = control, ambiguous middle excluded) over the last ~31 days of 4h bars (bounded by OI/taker-ratio's 30d Binance retention). For each classified bar, reports the PRECEDING 24h mean funding rate, OI 4h delta, and taker_buy_sell_ratio for movers vs controls (percentiles + a dependency-free separation check). Liquidations excluded entirely per operator ruling. Pure Binance Futures REST, no writes, no DB access. ~3-6 min (40 symbols x 5 endpoints).
          - oi-delta-decisive-analysis # READ-ONLY: operator follow-up to movers-vs-control -- means alone can't answer whether OI delta is a usable signal, this does. Same top-40 USDT-perp universe, full "mover vs everything else" partition (no excluded middle, so prevalence is the TRUE base rate), full p10/p25/median/p75/p90 distributions, a threshold sweep (2/3/5/8/12%) reporting recall/false-positive-rate/precision via Bayes at the real prevalence, and a 3-way lead-time decomposition (delta_0_24 full window, delta_0_12 late/near-decision, delta_12_24 early/true-lead) to establish how many hours of actual advance warning the signal carries. Pure Binance Futures REST (openInterestHist + klines), no DB, no writes. ~2-4 min (40 symbols x 2 endpoints).
          - external-endpoint-healthcheck # READ-ONLY structural guard, item 3(b): pings every distinct external REST endpoint this app depends on (Binance spot+futures, testnet, Bybit, TwelveData-adjacent, Fear&Greed, exchangerate.host, cryptopanic, Yahoo RSS via feedparser) with realistic params and checks BOTH http status AND that the exact field the calling code reads is actually present in the response -- a 200 with a missing/renamed key or an error-shaped body fails exactly like a 404. Built after finding 3 separate wrong-endpoint-404ing-silently bugs this week (2x taker-ratio + 1x OI, all in flow_features.py, PRs #408/#409). Exits non-zero (fails the workflow run loudly) if any endpoint is broken; known-unverifiable endpoints (Cloudflare-blocked, needs real credentials) are reported separately and do not fail the run. No DB, no writes, on-demand (not yet scheduled -- see PR description for the cron-schedule follow-up option).
          - system-truth # READ-ONLY, four sections in one run. (1) FIELD LIVENESS: every meaningful column (enumerated via information_schema, not hardcoded/sampled) on predictions/shadow_observations/shadow_trades/live_trades/flow_feature_snapshots -- null_rate 24h+7d, distinct_value_count 7d, last_non_null_at, min/max/mean, flags BROKEN(null>50%)/CONSTANT(distinct==1,n>100)/STALLED(>24h)/SUSPECT(out of plausible range). (2) LAYER/FEATURE/GATE HEALTH: L1-L10 evaluation+abstain-rate+distinct-direction from predictions.layer_scores; W4 flow_features null-rate+constant-check (W1/W2/W3/W5 skipped, confirmed dev-only); PR#266 gate-extension input population, explicitly notes gate decision OUTCOMES aren't persisted anywhere (no dispatch-log table) and mtf_adx_by_tf_json is computed+consumed live but never persisted (no audit trail). (3) TRAP HEALTH: 30d fire counts per trap_id from traps_fired JSONB. (4) ENDPOINT HEALTH: reuses external-endpoint-healthcheck's 16-endpoint check. Ends with a machine-readable JSON summary for healer baseline diffing. Built to prevent recurrence of the entire "field always NULL/CONSTANT, code path never fires, invisible because nothing checked" bug class found ~15 times this project (OI, taker-ratio x2, L8 abstaining, W1-W5 discarded, traps admin disconnected, ADX audit gap). Report-only -- does not fix anything it finds.
          - live-gate-block-audit # READ-ONLY, item 1(a) of the gate-divergence follow-up: gate ALLOW/DENY outcomes aren't persisted anywhere (confirmed by system-truth), but dispatch_if_eligible's caller DOES log every result via log.info("dispatch %s/%s -> %s: %s", ...) in live_prediction.py -- this greps the container's full retained log buffer for those lines, reports the REAL available window (container start time, NOT assumed to be 30d -- deploys recreate the container and truncate docker's log history), then tallies blocked_entry_quality counts by reason (blocked_wrong_regime / blocked_low_trend_strength / below_long_threshold) individually and combined, against total dispatch attempts as the denominator. Also greps for actual regime values seen in "blocked_wrong_regime: regime=X" lines to check whether the live regime gate has ever fired with a non-constant value. Pure log grep, no writes.
          - gate-counterfactual # READ-ONLY, items 1(a)+1(b): live-gate-block-audit found the log-based approach dead (container has been up only since the last deploy -- docker log retention is truncated on every redeploy, confirmed). This re-runs the REAL open_position_gate() function (imported, not reimplemented) against deterministically recomputed historical inputs instead: regime via real compute_market_regime() walk-forward day-by-day over real BTC daily klines (no lookahead), ADX via real _adx() rolling over real historical klines for whichever TFs appear as mtf_dominant_tf in the data, L2 direction/confidence already persisted per-row. 1(a): sizes each of regime/ADX/pattern-boost individually + combined against the true live-dispatch-eligible population (BTC/USDT 1h predictions, 30d -- confirmed via main.py that run_live_prediction() is called with zero args, i.e. BTC/USDT only). 1(b): counterfactual-applies all three combined to the 60d shadow LONG entry_score>=0.36 population, reports WR/avg_pnl_pct for would-reject vs would-pass. Also directly settles the "is regime constant" dispute with real distinct values over the lookback window. Pure REST (Binance klines) + read-only DB, no writes. ~2-4 min (ADX walk-forward per TF is the slow part).
          - gate-regime-window # READ-ONLY follow-up to gate-counterfactual: the regime_only isolated-gate result came back with ZERO blocked_wrong_regime rejections out of 718, all blocks falling through to below_long_threshold instead. The gate code confirms that's only possible if regime never actually opposed the signal direction across the whole window. This settles whether that's because regime was constant during the exact 30d live-dispatch window (as opposed to the wider 798d series, which does vary) or because of the LONG/SHORT direction mix -- prints real per-day regime values for the exact window plus the direction counts. Pure REST + read-only DB, no writes. ~10-20s.
          - l9-news-diagnosis # READ-ONLY, item 3 of the system-truth follow-up: layer9_news.score() abstains when zero news_items rows match (published_at>=now-60min, base=ANY(affected_assets), sentiment_score IS NOT NULL); separately CryptoPanic is optional (ingest_worker._build_adapters skips it silently if CRYPTOPANIC_API_KEY is unset, a real prior incident per its own code comment post-PR#97). Checks whether the key is set in prod, news_items row counts/freshness by source, BTC-tagged coverage, a 7d rolling 60min-window coverage check, and the real predictions.layer_scores->'9' null-rate split ALL-symbols vs BTC/USDT-only (the system-truth 99.2% figure was aggregate across the wider multi-symbol predictions population, not confirmed BTC-specific). No writes. ~10-20s.
          - predictions-null-boundary # READ-ONLY, item 2 second half: predictions.effective_score/realized_vol_20d showed null%24h=0 but null%7d=83.8% in the system-truth run. Settles whether that's a deploy-boundary artifact (PR#400's fix landed mid-window, all rows before some ts are null) or a standing symbol-scope gap (the wider 42-distinct-symbol/7d predictions mechanism never gets these columns, only BTC/USDT does) -- daily null-rate trend for BTC/USDT and ALL-symbols separately, per-symbol breakdown top-15, timeframe breakdown for non-BTC/USDT rows, and the cold_start CONSTANT value. No writes. ~10-20s.
          - l9-null-corrected # READ-ONLY correction to l9-news-diagnosis: `layer_scores -> '9' IS NULL` undercounts abstention because Postgres treats a JSONB value that IS the JSON literal null as NOT SQL-NULL ('null'::jsonb IS NULL is false) -- predictor.py sets layer_results[9]=None on abstain, which serializes to a JSON null AT an existing key, not an absent key. Checks one level deeper (->'direction', which correctly becomes SQL NULL when the parent is a JSON null), split BTC/USDT vs ALL symbols and per-symbol top-10, to settle whether system-truth's 99.2% figure reflects BTC/USDT specifically or is diluted by the wider 42-symbol population's obscure altcoins with near-zero base-asset-tagged news coverage. No writes. ~10-20s.
          - brain-rl-cache-archive # WRITE: mv all *.pt + eval_brain_*.json files from rl-cache into rl-cache/_predegenerate/. Idempotent. Forces next cron to cold-start. Does NOT touch rl_checkpoints DB rows.
          - brain-holdout-labels # READ-ONLY: label-side audit of the 59 backtest holdout trades (2026-05-19 → 2026-05-22). Reports trade dump + by-direction + by-hour + top-15 by-symbol — informs misclass analysis without needing brain decisions.
          - brain-reeval-checkpoints # READ-ONLY: re-evaluates each .pt in _predegenerate/ against current buffer state using PR-BRAIN-CORRECTNESS-METRIC. Outputs a comparison table with brain_correctness, sharpe, cumulative_reward — lets us judge old checkpoints by the new (non-invariant) metric without retraining.
          - brain-cron-log # READ-ONLY: tail last 60 lines of /var/log/trading-radar-brain-cron.log on the host (outside Docker). Returns the cron's last run — Sharpe, win_rate, checkpoint id registered.
          - shadow-allow-shorts-enable # WRITE: flip SHADOW_ALLOW_SHORTS=true in .env, recreate backend (up -d). Verifies both SHADOW_ALLOW_SHORTS and DISABLE_SHORT_SIGNALS after restart. Requires operator authorization. Does NOT touch any other .env variable.
          - stablecoin-hygiene # READ-ONLY: (a) stablecoin symbol activity in shadow_trades/shadow_open_positions post-2026-07-11, (b) low-ATR sweep (avg ATR% <0.05 = flag for blacklist), (c) current SHADOW_SPOT_BLACKLIST + MIN_ENTRY_SCORE_LONG
          - pwin-threshold-whatif # READ-ONLY: CLEAN p_win threshold what-if grid (blacklist excluded, in-memory refit): lower-bound T in {0.24..0.30}, window [T, 0.35], top-decile-excluded variants + model inversion (min entry_score where pred_p_win>=0.26).
          - a0-escalation # READ-ONLY: the A0 FULL-RANGE escalation, pre-committed in docs/superpowers/decisions/2026-10-22-a0-escalation-amendment.md (#599, amending #589/#590) -- all merged to main BEFORE the script existed. WHY: A0's in-band null spanned only a 0.1368-unit decile contrast inside a band 0.235 wide, and #590 pre-committed that such a null TRIGGERS this test rather than closing the question. POPULATION: predictions, timeframe=1h, direction=LONG, 60d -- ~44,606 rows over ~279 symbols with 92.4% of them BELOW the 0.30 entry bar, and final_score spanning 0.0500-0.5642 (NOT 0-1: the scorer has an effective ceiling near 0.57, which corrects the pre-registration's own framing). PRIMARY is ALL LONG rows, traded or not -- #590's literal 'never became trades' anti-join would remove exactly the highest-scoring rows and re-truncate the range this test exists to restore; untraded-only and confidence-gated are reported as SECONDARY. THE WINDOW IS FIXED BY DESIGN (5/10/20/40 bars from entry, horizon 10 NOMINATED criterion-bearing because the real population's mean hold is 9.60/13.04 bars) -- hypothetical entries have no realised exit, so the collider that downgraded A1a cannot arise here. Nested horizons are ONE observation measured four ways, never four results, and the probe says so. SEs ARE CLUSTER-ROBUST BY SYMBOL and this is the whole statistical point: hourly rows on one symbol OVERLAP (a 40-bar window shares 39 bars with the next), so n=44,606 does not carry 44,606 windows of information and the naive SE would return a tidy +8 sigma. The naive SE and the design effect are printed beside the clustered one, calendar-day clustering is a sensitivity, a strictly non-overlapping thinned subset is the replication, and A RESULT SIGNIFICANT ONLY ON THE NAIVE SE IS PRE-DECLARED A FAILURE -- the probe prints that verdict itself. BAR: 14 comparisons -> 3.729 sigma corrected (3.0-3.729 is SUGGESTIVE, do not announce). POWER IS PRINTED IN THE HEADER BEFORE ANY ESTIMATE: ~2.5x the in-band contrast and ~1.5 R per score unit detectable, NOT the ~7x the naive SE would claim, so a null reads as 'tested at the power actually available'. GEOMETRY from app/shadow/engine.py, not guessed: entry at the signal bar's CLOSE, R = min(1.5*atr, 0.05*entry) including the 5% SL cap, atr = simple mean of the last 14 true ranges. RUNTIME ~5-10 MIN: fetches ONE contiguous 1h series PER SYMBOL (~2 paginated requests x ~279 symbols) rather than one per row -- a per-row fetch would be 44,606 requests, ~22h, and the ssh channel dies long before that (see phase-a-scan's own first run). Semaphore(5) plus a progress tick every 20 symbols keeps the channel alive. Pure DB reads + public Binance klines, no writes.
          - phase-a-scan # READ-ONLY: the Phase A scan, implementing docs/superpowers/decisions/2026-10-21-phase-a-preregistration.md (#589, amended #590), BOTH merged to main before the script existed. POPULATION: LONG, entry_score>=0.30 (the REAL shadow entry bar) over 60d -- deliberately NOT mfe-mae-curve's >=0.36 population, which is the top third of a band spanning only 0.30-0.51 and would truncate A0's independent variable. Every variable is tested against BOTH final pnl_pct AND MFE_R (plus MAE_R for A0). A0 (headline, never run): entry_score vs MFE_R/MAE_R by decile, top-vs-bottom decile as the criterion-bearing contrast -- a null here TRIGGERS the full-range predictions test per #590, it does NOT close the question. A1 conclusive: mtf_agreement>=4 as a threshold (median reported) + funding_directional_adj. A2 joined: oi_delta_24h from flow_feature_snapshots (post-08-06 automatic, NO zero-fill). A3 DESCRIPTIVE ONLY: funding_rate, pre-registered as underpowered (~800 trades, 3sigma bar ~0.670pp) -- no conclusion permitted. A4 PROXY ONLY: depth_0_5pct_usdt is a ~daily universe snapshot, not depth at entry, so a null does NOT rule out dispatch-time depth. Snapshot joins are staleness-bounded (24h/24h/48h) and the row loss is reported. Prints the power note, the 12-comparison Bonferroni-corrected 3.68-sigma bar, and the baseline-event agreement rate BEFORE any path target. Order is fixed: CELLS -> BAR -> ESTIMATES -> REPLICATION. Pure DB reads + Binance klines, no writes. RUNTIME ~55 MIN, measured 2026-10-21, NOT the ~5-10 min originally estimated here: the population at the 0.30 bar is ~1,800 trades and each needs one SEQUENTIAL kline fetch at ~1.8s (Binance round-trip + the 0.1s FETCH_DELAY_S spacing inherited from mfe-mae-curve, which was sized for ~300 trades). 1,800 x 1.8s ~= 54 min. O(n) with a fixed per-item cost, so it finishes -- it is NOT the ADX quadratic hang. A stale estimate here is what sent someone hunting for a hang that did not exist, so it is corrected with the arithmetic beside it. Note also that GitHub Actions step logs are NOT retrievable while the step is in progress, so an empty log during a long run means nothing -- check --json status instead.
          - mfe-mae-curve # READ-ONLY: Phase 1 MFE study — fetches 1h Binance klines per LONG shadow_trade (entry_score>=0.36, 60d, blacklist excluded, top-20 at time-of-trade + ranks_21_30 for comparison). Computes MFE_R / MAE_R per trade; per TP_R in {0.5..2.0} reports implied_WR, expectancy_R, after-fee variant + SL-near-miss autopsy. ~5min runtime.
          - shadow-variant-rolling-report # READ-ONLY: paired-Δ analysis on shadow_trade_variants (Amendment 3 breakeven lane). Per (variant_name, cohort=atr_bound|cap_bound|aggregate, timeframe, window in {7,30,60,90}d): n_paired, n_armed, share_armed, mean paired Δ_gross ± SE. Also prints per-cohort DECISION rule (PASS/FAIL/NOT-YET-N at n>=100) + EARLY directional read at n>=30 + leader trigger. Filters: direction=LONG, entry_score>=0.36, blacklist excluded, top-20 rank at trade-open (BTCUSDT exempt). Δ_after_fee asserted == Δ_gross (paired fees cancel; divergence flagged as BUG).
          - settings-check # READ-ONLY: print selected Settings values from the RUNNING backend container (LIVE_COOLDOWN_ENABLED, SHADOW_TIMEFRAMES, MIN_ENTRY_SCORE_LONG, etc.) — verifies deployed env vs code defaults per operator's 2026-07-30 rule "never state env-gated behavior from a config.py default."
          - render-cohort-cards # READ-ONLY, Phase 4 Task 18 item 3: renders (does NOT send) the real Telegram card for one liquidity_added_spot and one futures_poll symbol, using the CURRENTLY DEPLOYED render_message + the real, currently-persisted liquidity numbers from the latest live_fleet_universe snapshot (highest-qvol symbol per cohort) -- not a unit test asserting the format, the actual output the real code produces from real current data. entry/SL/TP/margin are synthetic placeholder values (matching admin_test_trade.py's own precedent) since this proves the cohort banner + liquidity-figures rendering, not a real trade setup. No DB writes, no Telegram send -- prints the rendered body text only.
          - send-test-cohort-cards # WRITE (sends real Telegram messages, same acceptance-test pattern as healer-selftest): companion to render-cohort-cards for Phase 4 Task 18 item 3 -- console output does not prove phone rendering (markdown/emoji/line-wrapping/width all differ), so this POSTs the real rendered card for one liquidity_added_spot and one futures_poll symbol to the real configured TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID, using real current live_fleet_universe numbers and the real resolved TELEGRAM_APPROVAL_TIMEOUT_SECONDS (not a synthetic override). Prefixed [TEST] with an explicit "not a real signal, no buttons attached" line. Deliberately sends WITHOUT the real inline_keyboard (no Approve/Reject/Adjust buttons) -- this is a visual/legibility check only, must not be tappable into any real approval flow. Uses a realistic (illustrative, non-empty) sample layer_summary so the operator sees the actual populated "Layer scores" section, not the empty-dict "(no layer scores)" state that only a synthetic test with zero layers (like render-cohort-cards) ever produces. Operator confirms receipt + legibility on their own device -- that confirmation, not this probe's own success, is the actual pass/fail signal.
          - sync-staging-telegram-creds # WRITE, one-time infra fix (2026-08-20): send-test-cohort-cards' first staging run found TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID entirely unset inside backend-staging -- never populated when staging was stood up (repo-wide grep confirms no separate staging bot was ever intended; deploy.yml does not template these into .env.staging either). Operator-authorized: copies both values verbatim from prod's .env into staging's .env.staging (backs up .env.staging first; removes any pre-existing line for the same key before appending, so a rerun is idempotent), then force-recreates backend-staging so the new env actually takes effect (a plain restart reuses the already-baked container env) and verifies presence from inside the freshly-recreated container. Never prints the token/chat_id values themselves, only set=True/False booleans. Staging-only -- prod already has these values, there is never a reason to run this against prod.
          - sl-autopsy # READ-ONLY: SL distance / ATR ratio analysis for closed LONG shadow_trades last 30d. Per-symbol + overall avg sl_dist%, avg_atr%, sl_atr_ratio distribution for SL-exit vs TP-exit. Answers: are stops inside the noise band?
          - recent-perf # READ-ONLY: 30-day shadow trade win rate + avg P&L by direction + 14-day daily cadence — fresh performance snapshot replacing the stale May holdout dates in stats probe NOTE: shadow_trades.pnl_pct is ALREADY a percent (verified by identity against (exit_price-entry_price)/entry_price*100 on real prod rows, 2026-10-20) — never re-scale it by 100. FAILURE SIGNATURE if you do: per-trade averages print in the tens-to-hundreds (e.g. a daily avg of +110) instead of the real sub-1% scale.
          - brain-activate # WRITE: list rl-cache .pt files + cron log + activate latest rl_checkpoint (is_active=true) + restart backend. Use when brain has been training nightly but never activated.
          - soak-verify # Phase 1+2 soak check: cooldown=4h, brain_decisions rows, pattern confidence in notes, 7d shadow win rate + exit reasons
          - top-decile-anomaly # READ-ONLY: compares extreme (entry_score>=0.445) vs high (0.36-0.445) vs below (<0.36) LONG bands — WR, avg_pnl, symbol/hour/layer distributions + score/pnl correlation. Tests momentum-exhaustion hypothesis for top-decile reversal.
          - universe-anomaly # READ-ONLY: checks non-standard symbols in asset_universe, 币安人生USDT first/last appearance, orphan symbols in shadow_trades, live Binance top-100 for non-ASCII USDT tickers.
          - signal-lookup # READ-ONLY: (1) 4-value config check (MIN_ENTRY_SCORE_LONG, SHADOW_IGNORE_MIN_SCORE, SHADOW_ALLOW_SHORTS, DISABLE_SHORT_SIGNALS), (2) backend container start time (env-flip proxy), (3) lookup a shadow trade by signal_id + recent TRXUSDT predictions.
          - mtf-backfill-flip-screen # READ-ONLY, work order item 2 (2026-10-26): recomputes historical mtf_agreement for the futures_poll bar-clearing cohort (predictions, 1h, 30d, |final_score|>=0.36 -- 213 rows / 188 NULL / 24 symbols at the 2026-10-26 read, and the window ROLLS so quote the counts with their read time) and runs the decision-flip screen. Pre-registered in docs/superpowers/decisions/2026-10-26-mtf-backfill-preregistration.md, committed BEFORE the first run. compute_mtf_confluence has NO historical mode -- it votes on the latest 200 bars from a module-level cache and takes no timestamp -- so this imports the REAL decision logic (_vote_for_tf, _compute_agreement_and_dominant) and re-paths ONLY the fetch, choosing the market with #609's resolve_klines_url_for_symbol so a futures-only symbol reaches fapi instead of 404ing on spot. That wrong market IS the defect being measured. The threshold is read from the RUNNING settings object in-container, never config.py's default. NULL already PASSES the dispatcher veto (fail-open, 'never poison dispatch on missing signal data'), so the only possible transition is pass->block and a non-zero REVERSAL count is a measurement bug rather than a two-sided lever -- the probe says so itself. The outcome arm is pre-declared likely unresolvable and in fact ABORTS on step 0: zero rows in this cohort carry a validated_at, because item 1's validator outage (stopped 2026-09-03) covers the entire window. NO DB WRITE, no live change, no instrumentation. ~1-3 min (bar-aligned memoisation collapses the per-row fetches, Semaphore(5)).
          - listing-completeness-audit # READ-ONLY, HIGHEST PRIORITY probe (2026-10-26): is a universe member absent from BINANCE, or absent from OUR listing computation? bar_fetch resolves a market by POSITIVE membership in fetch_market_listings' sets and RAISES otherwise -- no spot default, deliberately -- which is only safe if those sets are COMPLETE. TONUSDT came back unresolvable at the shadow-seed boundary, so this fetches RAW spot + futures exchangeInfo UNFILTERED, replicates our two filters exactly (quoteAsset=='USDT' AND status=='TRADING', plus contractType=='PERPETUAL' for futures) so drift between audit and implementation is visible rather than assumed away, and classifies EVERY universe member that would raise: (a) present upstream but missing from our set => the no-default rule is refusing genuinely-listed symbols, a correctness regression; (b) genuinely absent upstream => an UNEXITABLE fleet member that drops out of sampling so no exit rule ever evaluates it (#601's uncovered third retention path). Counts the whole class, not just TONUSDT. Also fetches real klines for the suspects and prints the ACTUAL status code or exception class, which is the only thing separating 404-not-listed from timeout-2.0s-too-short -- mtf_confluence uses its own hardcoded spot URL and never consults these listings, so ARBUSDT-as-'permanent' may be a timeout rather than a routing failure. Ends with a tally of non-TRADING USDT symbols upstream, which sizes the (a) exposure for symbols not yet in the universe. No DB writes, no cache mutation. ~20-40s.
          - deploy-readback # READ-ONLY verification pattern (2026-10-29): imports the DEPLOYED module and CALLS the deployed callable with a pinned or discovered input, then checks the value that comes back. Exists because listing-completeness-audit REPLICATES fetch_market_listings' filters -- correct for an audit, useless as a verification: it reported '0 of 31 would raise' while the routing fix was still uncommitted. Its failure message states the rule it enforces -- A VERIFICATION THAT REIMPLEMENTS THE LOGIC UNDER TEST VERIFIES THE REIMPLEMENTATION. Generic by design: each check is a declarative ReadBack of (module, callable, input, expectation), so a future deploy ADDS A ROW rather than writing a new probe -- built generically because two fixes needed the identical thing one day apart. Current rows: the routing predicate (a listed-but-not-TRADING symbol must ROUTE, with the symbol DISCOVERED at runtime because that set turned over three symbols in twelve hours and a pinned name would silently verify nothing) and mtf_confluence's transport (RateLimitedClient, pool bounded below httpx's default of 100, klines weight 2 agreeing with the binance adapter). EXITS NON-ZERO on failure, unlike the report probes: a failed read-back means the deploy did not take. Verified able to fail -- an unbounded-pool mutant reds it with exit 1. ~20-40s.
          - check-events # READ-ONLY, work order item 3 (2026-10-26): the retrieval path for guards, probes and counters. Prints the SILENCE REPORT first -- registry entries that have not reported inside their own window, with NEVER-REPORTED held as a state distinct from merely stale. That report cannot be produced by sql-select: find_silent_checks iterates the Python registry EXPECTED_CHECKS and looks each name up, because a GROUP BY over check_events can only name checks that already reported -- the check that never ran has no row, forms no group, and is exactly the case that let phase4-universe-discrepancy-check sit dead for months while every run exited 0. Then per-check totals and the top per-subject counts (7d). File-backed at backend/scripts/check_events_report.py rather than a base64 blob, because a doubly-assigned PY_SCRIPT_B64 is how #600 lost a whole section silently. Exits 0 even when it finds something: a finding is not a malfunction, and a red run for a finding trains people to ignore red runs. DETECTION ONLY -- no remediation exists to invoke, enforced by a structural test, see #571 for why.
          - universe-tradable-audit # READ-ONLY report (2026-10-29): which live_fleet_universe members are NOT in Binance's futures TRADING set right now. Entry is already safe -- refresh_live_fleet_universe builds `candidates` from tradable_futures -- so this measures the RETENTION exposure: the open-position override re-adds every symbol in get_open_position_symbols() with no tradability check, and a position on a non-TRADING symbol can never close, so the override re-adds it on every refresh forever. Unexitable in the strongest sense: not "illiquid" but "no counterparty exists", which the liquidity hysteresis cannot detect because it measures depth and spread on an order book that is not there. Pipes the REPO's copy of backend/scripts/universe_tradable_audit.py into the container's python over stdin rather than running /app/scripts/... from the image -- ONE source of truth, and it works BEFORE the script is deployed, which is the point: the removal list must be re-measured INSIDE the PR that proposes the removal, because the set turns over daily (2026-10-27's doc named HFTUSDT/VICUSDT and said in the same breath not to quote it). No base64 copy of the script exists -- #600 lost an entire section to a doubly-assigned PY_SCRIPT_B64. Calls the DEPLOYED fetch_market_listings_full instead of reimplementing its status filters, per the deploy_readback rule. Exits 0 even when it finds something.
          - sql-select # READ-ONLY: run one SELECT / WITH statement from the `sql` input against prod Postgres via the backend container. Enforced read-only at 3 layers (shape check, SET SESSION TRANSACTION READ ONLY, statement_timeout=15s). Row cap 500. See backend/scripts/sql_select_probe.py.
          - healer-status # READ-ONLY: current + last-24h healer findings summary (Phase 0). Groups by detector_name, severity + shows the 10 most-recent rows for triage.
          - healer-selftest # SENDS one synthetic [SELFTEST]-tagged CRITICAL alert through the full alert_routing chain (Telegram > SMTP > log). Operator confirms physical Telegram receipt on their phone — the acceptance test for healer Phase 0 alerting. Also records one healer_findings row so healer-status shows when it last ran.
          - healer-c1-selftest # TIER 2b defect-sweep fix (2026-08-06). C1 (dispatch-error monitor) had ZERO rows ever in healer_known_error_types — its alarm path had never been proven to fire. Injects a synthetic, uniquely-named dispatch exception via the real record_dispatch_error, runs the real C1 detector against it, and confirms it classifies as NEVER-BEFORE-SEEN + fires a critical alert through the real alert_routing chain (operator confirms physical Telegram receipt, same acceptance test as healer-selftest). Permanent on-demand canary — a fresh exception type every run, so it proves itself again on every future run, not just once.
          - regime-live-check # READ-ONLY: BUG 1 diagnostic — reports the live process's regime cache state, attempts a FRESH BTCUSDT daily-kline fetch + classification (isolates fetch-failure vs cache-never-persists vs genuine neutral), and prints REGIME_GATE_ENABLED/ADX_GATE_ENABLED's deployed values.
          - prod-env-reload # WRITE (process only, no DB write), PROD ONLY: `docker compose up -d backend`, which RE-READS .env. Exists because `prod-restart-only` uses `docker compose restart`, and restart PRESERVES the container's existing environment -- an .env edit followed by a restart leaves a healthy container reporting the OLD values, with no error, no unhealthy status and nothing in the logs. That happened 2026-10-23 with DISABLE_SHORT_SIGNALS and MIN_ENTRY_SCORE_SHORT: the file was correct, the restart succeeded, and both values stayed stale until `up -d` was run -- and the correct verb was already in this file, in shadow-allow-shorts-enable, which uses `up -d` for precisely this reason. Use THIS probe for any CONFIGURATION change and `prod-restart-only` only to bounce the process without re-reading config. Prints RestartCount + StartedAt before/after. *** THEN RUN `settings-check` AND READ THE VALUES BACK: an env flip is NOT APPLIED until the running object has been read back. Reading the .env file establishes only what the file says. ***
          - prod-restart-only # WRITE, PROD ONLY: bare `docker compose restart backend` -- *** CANNOT PICK UP AN .env CHANGE: restart preserves the container's existing environment, so a config flip routed through this probe SILENTLY NO-OPS while leaving a healthy container reporting stale values. Use `prod-env-reload` for configuration changes; this probe is for PROCESS restarts only. *** — no .env change, no DB write. Every other restart-capable probe bundles a real config/state change with its restart; this is the isolated restart lever for verification runs (e.g. confirming migration 0040 / PR #516's 5 analytics columns round-trip through a real restart). Reports RestartCount + StartedAt before/after.
          - liquidity-floor-depth-sensitivity # READ-ONLY: is the current $50k depth floor too strict for a ~$200-500 operator order size? Sweeps the depth threshold (50k/25k/10k/5k) while holding qvol ($20M) and spread (5bps) fixed, over the same real full USDT-M perpetual market check_liquidity/live_fleet_universe candidate-selection logic uses. Methodology matches the 2026-08-15 liquidity-floor-selector decision record exactly (3 samples/candidate, ~4s apart, stable-pass/borderline/stable-fail classification) so the $50k-tier numbers are directly comparable to that decision's reference table (total/spot-backed/futures-only). Also computes REAL order-book-walk price impact for a $500 market order (both buy and sell side) from the same real depth snapshots, bucketed by measured depth — not a synthetic formula, though a simple order_usdt/depth_usdt cross-check is printed too. Explicitly reports what this CANNOT measure: fast-move/stressed-book depth, which does not scale down with order size the way calm-book impact does. Does not change any threshold — measurement only, per operator's explicit instruction. Pure Binance Futures + Spot REST reads, no DB, no writes. ~3-6 min (100+ candidates x 3 samples).
          - layer-value-isolation # READ-ONLY: isolates each scoring layer's actual value on closed LONG shadow_trades (60d + 90d, entry_score>=0.36, blacklist excluded, top-20 rank at trade-open, atr_bound cohort -- exact population convention from backend/scripts/mfe_mae_curve.py). Per live layer (L1/L2/L3/L4/L5/L9 -- L6/L8 abstain heavily, L7/L10 are permanent stubs and excluded entirely), buckets trades by that layer's signed score at entry into strong (|score|>=0.5) / weak / abstained, reporting n/WR/avg_pnl_pct/SE per bucket -- does a strong reading actually predict a better outcome, and which layers carry the signal vs which are noise. Also reports each layer's abstain rate, and (90d only) the top 10 L2 patterns by fire count with pattern_stats' STORED assumed accuracy vs the ACTUAL observed win rate in this population, side by side. Measurement only -- no weighting or code changes. Pure DB reads, no writes. Runs in seconds. *** FITTED-OBJECT WARNING (2026-10-21): this probe sorts outcomes by a layer's own score, which is the shape that needs an untrained baseline before its sigma can be read -- a random policy reads -2.30 sigma through the brain's analogous BOOST/SUPPRESS harness because the bucket assignment is itself a fitted object. STANDING RULE: 15m + window after 2026-09-08 + sorted by entry_score/effective_score/L2's own score + comparing outcome means ==> needs the baseline treatment. L2's pattern accuracy is LIVE for 15m ONLY (COLD_START_THRESHOLD_BY_TIMEFRAME={'15m': 50}, #557); every other timeframe returns the 100_000 sentinel and stays on the flat prior, which carries no outcome information. This probe's ORIGINAL run is clean because it reached main 2026-08-31, before pattern_stats was backfilled at 2026-09-05T09:18:32Z -- clean by window, not by design. A RE-RUN TODAY THAT INCLUDES 15m IS NOT CLEAN. Read the threshold from layer2_patterns.py, not from this sentence.
          - direction-calibration-retrospective # READ-ONLY: 2026-08-20 layer audit item 1 -- measure BEFORE wiring app.core.scoring.calibration into any live call site (it is currently unused, present in the aggregator's signature but never called). Operator's PRE-COMMITTED decision rule (set before results were seen): wire it only if avg_pnl_pct improves materially on SURVIVES vs today's population AND surviving volume stays usable; do NOT wire if expectancy is roughly unchanged and only volume falls (gate change wearing a calibration costume -- MIN_ENTRY_SCORE_LONG already does that); do NOT wire if the multiplier is near-static across historical recompute points (part d) -- a constant is not a calibration. (a) Calls the REAL compute_calibration_for_predictor() directly against prod -- reports the multiplier it would return RIGHT NOW for LONG/SHORT/NEUTRAL, plus the underlying avg_pnl_pct and sample count in its 50-row-per-direction lookback window (not the full prediction_validations table size). (b) Applies that multiplier retrospectively to the last 90d of LONG+SHORT shadow_trades signals clearing today's +-0.36 gate (blacklist excluded): score distribution shift, how many still clear the gate, WR/avg_pnl_pct WITH n AND SE for the surviving vs full population. (c) THE DECIDING QUESTION -- compares the DROPPED subset (clears today, wouldn't after calibration) against SURVIVES, gap tested against 2x combined SE: inside the error bar defaults to gate-change-costume per the pre-committed rule, not a coin-flip read. Also checks for newly-qualifying signals on any amplified side. (d) STABILITY CHECK -- recomputes the multiplier at 6 historical checkpoints across the 90d window (same real lookback logic, bounded to validated_at<=checkpoint); flags near-static (range<0.05) series as DO NOT WIRE. Pure DB reads, no writes, no code change. Runs in seconds.
          - phase4-universe-discrepancy-check # READ-ONLY, STAGING-ONLY: 2026-08-20 -- verifies why staging live_fleet_universe carries 73 symbols against the 2026-08-15 ratified measurement of 42 (34 spot-backed + 8 futures-only). (a) prints QVOL_FLOOR_USDT/SPREAD_MAX_BPS/DEPTH_FLOOR_USDT imported directly from app.data.futures_liquidity against the ratified values. (b)/(c) re-measures every symbol in the current snapshot against the ORIGINAL 3-sample/~4s-apart/stable_pass=3-of-3 methodology (not the shipped selector's own 5-sample/3-of-5-entry/unanimous-exit hysteresis), using the real check_liquidity function -- classifies stable_pass / borderline / stable_fail per symbol, broken down by cohort. (d) cross-references against get_open_position_symbols (the real function the selector's own retention override uses) to separate open-position-protected exceptions from unexplained over-admission. (e) 2026-08-20 addition: reuses the same 3 real samples to report how many of the current universe would trip the new fast-exit severity trigger (depth<50% floor OR spread>2x max, imported directly from app.shadow.live_fleet_universe's SEVERE_DEPTH_RATIO/SEVERE_SPREAD_RATIO) -- flags which of those are open-position-protected. Always targets staging (prod has no live_fleet_universe table yet -- Phase 4 hasn't been cherry-picked to main). Ignores TARGET input. ~5-8 min (73 symbols x 3 samples x ~4s gaps + real API latency).
          - pattern-stats-backfill-delta # READ-ONLY, STAGING-ONLY: 2026-08-26 -- #507's backfill delta + #506 item 1(c) corrected (the layer-value-isolation-followup probe's own item 1(c) still uses the ORIGINAL broken predictions-JOIN query, never updated to match PR #507's fix -- this one uses the real shadow_trades-only query, imported directly from app.ml.patterns). PART 1: for the top 20 patterns in the real, already-backfilled pattern_stats table, reports observed accuracy vs the flat 0.5 default and the resulting weighting ratio, and how many clear COLD_START_THRESHOLD (STALE-PROOFING 2026-09-05: that constant is 100_000, not the 50 this text used to assert -- see FU-48; read it from layer2_patterns rather than trusting any number quoted here). PART 2: applies real per-pattern accuracy to every real closed shadow_trade that fired one of those patterns using the REAL layer2_patterns.score() formula, reports the shift in L2's own raw contribution (mean/stdev before vs after), how many trades flip direction, and avg_pnl_pct+SE for the meaningfully-affected subset. CORRECTION 2026-09-05: this probe used to claim pattern_stats was 'not wired into live scoring'. That was WRONG and is the exact false belief behind FU-48 -- PatternStatsLookup has always been read by live scoring via predictor -> live_prediction / shadow.worker, and was inert only because the table was empty. It is inert TODAY only because COLD_START_THRESHOLD is held at 100_000 (#551). This probe itself remains measurement-only and writes nothing. Targets staging (STALE 2026-09-05: prod IS now backfilled -- 3,578 rows written at 09:18:32Z once #507 reached main via Stage 3 #542 -- so the original reason for staging-only no longer holds; the probe still ignores TARGET and hits staging). Ignores TARGET input.
          - layer-value-isolation-followup # READ-ONLY: follow-up to layer-value-isolation's results. (1c) Retrospective pattern_stats simulation using the REAL app/ml/patterns.py writer's exact population + exit_reason='TAKE_PROFIT' correctness definition, for the same top-10 pattern_ids -- what the table WOULD show if the write path were fixed, vs the flat 0.5 default it's stuck on. Does NOT write to pattern_stats. (2) IN-SAMPLE layer-contribution variant simulation (L2-only / L2+L1 / all-current-control / minus-noise-layers) on static score only (pre-brain_adjust/trap/news, which are identical across variants) -- reports n_signals/WR/avg_pnl/SE per variant, explicitly caveated as in-sample and not a shipping signal. (3) For the shared-abstain-gate subset (L1-L5 all None simultaneously), reports entry_score distribution, which of L6/L7/L8/L9/L10 are actually present, and the subset's own outcome stats -- what are these trades actually scored on. Measurement only, no code/weighting changes. Pure DB reads, no writes. Runs in seconds.
          - retag-dry-run # READ-ONLY, STAGING-ONLY: 2026-08-30 -- dry-run (no writes) for the operator-approved cohort-tag fix. Reports how many rows in predictions/shadow_trades/telegram_signals/live_trades would have a DIFFERENT symbol_source under the new PURE classifier (in the frozen 73-symbol baseline -> established_top20; not in baseline, no spot pair -> futures_poll; not in baseline, has spot pair -> liquidity_added_spot) versus their current stored value, broken down by (current_tag -> new_tag) per table with row counts. Numbers only -- the actual retag write is a separate, operator-gated step. Ignores TARGET input.
          - baseline-final-recount # READ-ONLY, STAGING-ONLY: 2026-08-30 -- FINAL locked cohort baseline per operator's corrected ruling: asset_universe is the selector's INPUT (a ranking, ranks 21-30 never streamed), not its output, so the only real record of pre-cutover fleet membership is the predictions table itself. Baseline = symbols with predictions on >=2 distinct calendar days in the 30d window ending at cold-start, minus the 6 confirmed stablecoin/synthetic exclusions (UUSDT/SKHYBUSDT/SOXLBUSDT/KORUBUSDT/SNXXBUSDT/EURIUSDT). Reports the final symbol list plus explicit verdicts for XPLUSDT/REDUSDT/NEARUSDT/ADAUSDT/BICOUSDT/PLUMEUSDT/TRUMPUSDT. Read-only, no writes. Ignores TARGET input.
          - baseline-distinct-day-check # READ-ONLY, STAGING-ONLY: 2026-08-30 -- corrected test for the operator's 24h-continuous-presence rule. The wall-clock longest-continuous-run proxy (baseline-continuity-check) turned out confounded: asset_universe refreshes at a fixed wall-clock hour (00:00 UTC daily), so measured run length depends on what time of day a symbol happened to join, not on how many times it was genuinely re-selected -- confirmed directly (9 symbols land at EXACTLY 23.0h, 4 at exactly 22.0h, 3 at exactly 26.0h, 3 at exactly 11.0h; real market-driven timing would not cluster on round numbers). Tests instead whether a symbol appears in asset_universe on >=2 DISTINCT CALENDAR DAYS (a direct count of real re-selection events at the daily refresh, immune to join-time clock alignment). Read-only, no writes. Ignores TARGET input.
          - baseline-continuity-check # READ-ONLY, STAGING-ONLY: 2026-08-30 -- checks whether the operator's 24h-continuous-presence rule (a symbol counts as a genuine pre-expansion fleet member only if it was held for >=1 full daily refresh cycle, not merely cumulative footprint) lands on a clean bimodal split or a dense middle -- computes each symbol's LONGEST CONTINUOUS run of hourly predictions (90min gap tolerance) in the 30d pre-cutover window, not raw total count (which can be high from scattered non-contiguous appearances). Reports the full distribution as a histogram plus an explicit count of symbols sitting in the [10h, 30h) dead zone straddling the 24h cutoff. Read-only, no writes. Ignores TARGET input.
          - baseline-observed-activity # READ-ONLY, STAGING-ONLY: 2026-08-30 -- rebuilds the frozen cohort baseline from OBSERVED pre-cutover activity (predictions/telegram_signals/shadow_trades in the 30d window ending at cold-start, 2026-08-19 ~11:26:40 UTC), per operator's rejection of the asset_universe.rank-derived list (4 of the rank-based 20 are stablecoin/pegged spot-only symbols with no futures market and zero live_fleet_universe history). Reports symbol/pred_n/telegram_n/shadow_n/first_seen/last_seen, plus a flagged subset of short/late-arriving edge cases for the operator to rule on individually. Also runs Task A's structural rescue-path sweep: any symbol whose first-ever live_fleet_universe row is tagged established_top20 but isn't part of the actual cold-start batch is proof of the open-position-rescue path (live_fleet_universe.py ~502-506) fabricating the tag -- reports those symbols' row counts across all 4 tables. Read-only, no writes. Ignores TARGET input.
          - cohort-tag-defect-sizing # READ-ONLY, STAGING-ONLY: 2026-08-30 -- Step 1 of the operator's cohort-tag-defect ruling, sizing before any fix is built. (a) distinct symbols whose live_fleet_universe cohort actually CHANGED across snapshots (not the same as task18-staging-verification's 47-symbol membership-flap count -- a symbol can flap membership while its cohort stays constant). (b) row counts in shadow_trades/predictions/telegram_signals/live_trades for those specific symbols. (c) per cohort, what % of rows sit under a symbol whose tag ever changed -- the actual independence-corruption question. Read-only, no writes. Ignores TARGET input.
          - entry-timing-recon-tally # READ-ONLY: 2026-09-16 -- tallies the entry-timing recon's LOG-ONLY output (#549/#562 shipped it with no retrieval path -- FU-47's class). Greps backend logs for 'entry_timing_recon:' over --since=24h and reports: PAIRED count, FALSE_START count, eligibility fraction f = PAIRED/(PAIRED+FALSE_START), a bars_early histogram for PAIRED events, per-timeframe breakdown, and -- so retention is MEASURED rather than assumed -- the earliest backend log timestamp still available. Numbers only, no writes. This is a salvage tool for the current retention window; the durable fix is persisting the events (separate PR). Ignores TARGET input.
          - btc-trend-filter-test # READ-ONLY: the pre-registered BTC trend filter test (docs/superpowers/decisions/2026-10-20-btc-trend-filter-preregistration.md, committed to main BEFORE this probe). VARIABLE: BTCUSDT above/below its own trailing 20-day SMA at each trade's ENTRY, taken from the latest daily bar whose CLOSE TIME is strictly before the entry -- no lookahead. Monthly BTC drift is INADMISSIBLE (only knowable once the month ends, so untradeable) and is not used. Tests avg_pnl_pct in BTC-uptrend vs BTC-downtrend, LONG and SHORT SEPARATELY, full history from 2026-05-01. Bar is 3 x SE_diff computed from the REAL per-cell sd and cell sizes, not an assumed pooled sigma. Prints in the pre-registered order: cell sizes, then the bar, then the point estimates. Replication = temporal halves, consistency (same sign AND within 2 SE_diff of primary), not re-significance. pnl_pct is already a percent and is NOT rescaled. Binance spot klines + read-only DB, no writes. ~30-60s.
          - brain-offline-eval # READ-ONLY (no checkpoint save, no rl_checkpoints row, no DB write): 2026-09-17 -- runs tools/ml/eval_brain_offline.py inside the backend container against prod. Pre-registered in docs/superpowers/decisions/2026-09-17-brain-offline-eval-preregistration.md: strict temporal split (train <2026-08-20, primary Aug20-Sep05, replication Sep05+), PPO trained from RANDOM INIT on the train window only (no warm start, no id=70/id=62 lineage), every held-out trade scored by brain_adjust and V(s), bucketed, avg_pnl_pct with n+SE per bucket, untrained neutral baseline on the identical harness, train-set performance next to held-out, new symbols reported separately, oi_delta missingness indicator in the L8 slot. Prints the four pre-registered criteria and a JSON block. CPU, ~minutes. Ignores TARGET input.
          - task18-staging-verification # READ-ONLY, STAGING-ONLY: 2026-08-26 -- Phase 4 Task 18 staging verification, items 1/2/5/6/7/9/10 of the operator's 10-item checklist (item 3 already confirmed by operator on phone; item 4 is an app-view UI check, not a DB query; item 8 -- liquidity-floor evaluated/passed/rejected WITH REASONS -- is log-only, covered by a docker compose logs grep chained in this same probe, not by the python script). Items 1-2: candle/prediction counts per symbol for the futures-only cohort (futures_poll + liquidity_added_spot), 24h window. Item 5: compares established_top20 symbols' hourly prediction cadence in the 24h before vs after the first futures_poll prediction (the natural Phase-4-active boundary on staging), flagging any zero-prediction hours. Item 6: idempotency -- duplicate (symbol, timeframe, ts) predictions rows for the futures-only cohort (expected zero), plus live_prediction_watermarks contents. Item 7: futures_poll_task's worker_heartbeats.details->rate_limit_waits (expected zero total). Item 9: symbol_source cohort-value breakdown across all 4 tagged tables (predictions/telegram_signals/live_trades/shadow_trades). Item 10: hysteresis -- walks live_fleet_universe's distinct snapshot_at refresh cycles over the last 7 days and flags any symbol with more than one entry/exit transition (flapping). Pure DB reads + one log grep, no writes. Always targets staging (Phase 4 hasn't reached prod). Ignores TARGET input.
      sql:
        description: SQL for the sql-select probe (SELECT or WITH only, single statement, 15s timeout, 500-row cap). Ignored by every other probe.
        required: false
        default: ''
        type: string
      target:
        description: sql-select target — 'prod' (default) hits /opt/trading-radar backend against trading_radar; 'staging' hits /opt/trading-radar-staging backend-staging against trading_radar_staging. Ignored by every other probe.
        required: false
        default: prod
        type: choice
        options:
          - prod
          - staging

      since:
        description: 'docker compose logs --since window for entry-timing-recon-tally (e.g. 24h, 240h). Only that probe reads it.'
        required: false
        default: '24h'
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      HETZNER_INSTALL_DIR: ${{ secrets.HETZNER_INSTALL_DIR }}
    steps:
      - name: Checkout (for probes that need repo files like audit-replay-verify)
        uses: actions/checkout@v4

      - name: Set up SSH
        if: env.HETZNER_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Run probe
        if: env.HETZNER_HOST != ''
        env:
          PROBE: ${{ inputs.probe }}
          SQL: ${{ inputs.sql }}
          TARGET: ${{ inputs.target }}
          SINCE: ${{ inputs.since }}
        run: |
          USER_DEFAULTED="${HETZNER_USER:-root}"
          DIR_DEFAULTED="${HETZNER_INSTALL_DIR:-/opt/trading-radar}"
          case "$PROBE" in
            errors)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose logs --tail=300 backend | \
                 grep -iE 'error|exception|traceback|500 internal|sqlalche\\.me' | \
                 tail -80"
              ;;
            logs)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose logs --tail=200 backend"
              ;;
            tables)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT 'universe_history' AS t, count(*) FROM universe_history \
                   UNION ALL SELECT 'asset_universe', count(*) FROM asset_universe \
                   UNION ALL SELECT 'predictions', count(*) FROM predictions \
                   UNION ALL SELECT 'shadow_trades', count(*) FROM shadow_trades \
                   UNION ALL SELECT 'live_trades', count(*) FROM live_trades;\""
              ;;
            scanner)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT user_id, timeframe, count(*), max(ts) \
                   FROM predictions GROUP BY user_id, timeframe ORDER BY 1, 2;\""
              ;;
            checkpoints)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT 'ml' AS kind, id, model_name, version, is_active, \
                    activated_at, deactivated_at, sha256 \
                    FROM ml_checkpoints ORDER BY id DESC LIMIT 10;\" -c \
                 \"SELECT 'rl' AS kind, id, model_name, version, is_active, \
                    activated_at, deactivated_at \
                    FROM rl_checkpoints ORDER BY id DESC LIMIT 10;\" && \
                 docker compose exec -T backend ls -la /app/data/ml-cache/ 2>/dev/null || true"
              ;;
            stats)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT 'paper trades closed' AS kind, count(*) AS n FROM shadow_trades WHERE closed_at IS NOT NULL \
                   UNION ALL SELECT 'paper trades open', count(*) FROM shadow_trades WHERE closed_at IS NULL \
                   UNION ALL SELECT 'live trades open', count(*) FROM live_trades WHERE status = 'open' \
                   UNION ALL SELECT 'live trades closed', count(*) FROM live_trades WHERE status = 'closed';\" -c \
                 \"SELECT direction, count(*) AS trades, \
                    round((100.0 * sum(CASE WHEN pnl_pct > 0 THEN 1 ELSE 0 END) / nullif(count(*), 0))::numeric, 1) AS win_rate_pct, \
                    round(sum(pnl_usdt)::numeric, 2) AS total_pnl_usdt, \
                    round(avg(pnl_pct)::numeric, 2) AS avg_pnl_pct \
                    FROM shadow_trades WHERE closed_at IS NOT NULL GROUP BY direction \
                    UNION ALL SELECT 'TOTAL', count(*), \
                      round((100.0 * sum(CASE WHEN pnl_pct > 0 THEN 1 ELSE 0 END) / nullif(count(*), 0))::numeric, 1), \
                      round(sum(pnl_usdt)::numeric, 2), \
                      round(avg(pnl_pct)::numeric, 2) \
                    FROM shadow_trades WHERE closed_at IS NOT NULL;\" -c \
                 \"SELECT direction, count(*) AS predictions, \
                    round(avg(final_score)::numeric, 3) AS avg_score, \
                    round(avg(confidence)::numeric, 3) AS avg_conf, \
                    max(ts) AS last_seen \
                    FROM predictions WHERE ts > now() - interval '24 hours' \
                    GROUP BY direction ORDER BY direction;\" -c \
                 \"SELECT date_trunc('hour', ts) AS hour, count(*) AS predictions \
                    FROM predictions WHERE ts > now() - interval '6 hours' \
                    GROUP BY 1 ORDER BY 1 DESC LIMIT 6;\""
              ;;
            shadow-debug)
              # Why are zero shadow_trades being created? Checks the four
              # things that can prevent the shadow worker from opening
              # positions: (1) the worker isn't running / has crashed,
              # (2) asset_universe is empty so it falls back to BTCUSDT only,
              # (3) prediction scores never clear the 0.30 LONG threshold,
              # (4) the worker is opening positions but persist is failing.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== row counts (REAL open count from shadow_open_positions) ===' && \
                 docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT 'shadow_open_positions' AS t, count(*) FROM shadow_open_positions \
                   UNION ALL SELECT 'shadow_trades (closed)', count(*) FROM shadow_trades \
                   UNION ALL SELECT 'shadow_cooldowns', count(*) FROM shadow_cooldowns \
                   UNION ALL SELECT 'asset_universe (total rows)', count(*) FROM asset_universe \
                   UNION ALL SELECT 'asset_universe (latest snapshot symbols)', \
                     count(*) FROM asset_universe \
                     WHERE snapshot_at = (SELECT max(snapshot_at) FROM asset_universe);\" && \
                 echo '=== prediction score distribution (24h) — entry needs score > 0.30 LONG or < -0.50 SHORT, conf >= 0.50 ===' && \
                 docker compose exec -T postgres \
                 psql -U postgres -d trading_radar -c \
                 \"SELECT count(*) AS total_24h, \
                    round(min(final_score)::numeric, 3) AS min_score, \
                    round(max(final_score)::numeric, 3) AS max_score, \
                    round((percentile_cont(0.95) WITHIN GROUP (ORDER BY final_score))::numeric, 3) AS p95_score, \
                    round(min(confidence)::numeric, 3) AS min_conf, \
                    round(max(confidence)::numeric, 3) AS max_conf \
                    FROM predictions WHERE ts > now() - interval '24 hours';\" -c \
                 \"SELECT 'long-eligible (score>0.30 AND conf>=0.50)' AS gate, count(*) FROM predictions \
                    WHERE ts > now() - interval '24 hours' AND final_score > 0.30 AND confidence >= 0.50 \
                    UNION ALL SELECT 'short-eligible (score<-0.50 AND conf>=0.50)', count(*) FROM predictions \
                    WHERE ts > now() - interval '24 hours' AND final_score < -0.50 AND confidence >= 0.50 \
                    UNION ALL SELECT 'conf-blocked (score passes, conf<0.50)', count(*) FROM predictions \
                    WHERE ts > now() - interval '24 hours' AND (final_score > 0.30 OR final_score < -0.50) AND confidence < 0.50;\" && \
                 echo '=== shadow worker activity over the entire log buffer ===' && \
                 docker compose logs --tail=20000 backend 2>&1 | \
                   grep -iE 'shadow|MultiStreamReader|start_shadow|worker:' | tail -80 && \
                 echo '=== startup banner (first 80 lines of log buffer) ===' && \
                 docker compose logs --tail=20000 backend 2>&1 | head -80 && \
                 echo '=== ENV + WORKER_ENABLED that lifespan checks ===' && \
                 docker compose exec -T backend env | grep -iE '^(ENV|WORKER_ENABLED|AUTONOMOUS_TRADING_ENABLED|BINANCE)=' | sort && \
                 echo '=== container restart counts (anything > 0 = crash loop) ===' && \
                 docker inspect tr-backend --format 'restarts={{.RestartCount}} status={{.State.Status}} health={{.State.Health.Status}}'"
              ;;
            ws-probe)
              # Direct one-shot test: open a WS to fstream.binance.com from
              # inside the backend container with a 2-symbol subscription
              # (BTCUSDT + ETHUSDT — known-valid). Print the first 10 frames.
              # If this works → the bug is the 30-symbol universe contains
              # invalid streams and Binance rejects the whole sub silently.
              # If this hangs → outbound to fstream.binance.com is blocked
              # at the network layer (Hetzner firewall / DNS / etc.) and
              # the bug is below the application.
              # The script is base64-encoded so it can pass through SSH +
              # docker exec without YAML / shell quoting hell.
              # Updated 2026-05-11: prior aggTrade probe showed handshake OK
              # but ZERO frames — Binance accepts the connection then sends
              # nothing. Likely cause: regional / IP geoblock on Futures
              # market data. New script also tests SPOT WS as a control:
              # SPOT works + FUTURES doesn't = clear geoblock signal.
              # Plus dumps our public IP and ipapi.co geo info so we know
              # which Hetzner DC region we're in.
              SCRIPT_B64=''
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && timeout 60 docker compose exec -T backend python -c 'import base64; exec(base64.b64decode(\"$SCRIPT_B64\").decode())' || echo 'ws-probe killed by timeout=60s'"
              ;;
            net-probe)
              # Three quick reachability tests from inside the backend
              # container, each with a hard timeout so the probe finishes
              # in ~15s regardless. Together they isolate where the WS
              # path is failing:
              #   - DNS: getent hosts fstream.binance.com
              #   - TCP: bash /dev/tcp open to fstream.binance.com:443
              #   - HTTPS: curl -v https://fstream.binance.com/ (404 is OK)
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== DNS resolution (fstream + fapi + api) ===' && \
                 docker compose exec -T backend bash -c 'getent hosts fstream.binance.com fapi.binance.com api.binance.com' && \
                 echo '=== TCP open to fstream.binance.com:443 (5s timeout) ===' && \
                 docker compose exec -T backend bash -c 'timeout 5 bash -c \"</dev/tcp/fstream.binance.com/443\" && echo TCP_OK_fstream || echo TCP_FAIL_fstream' && \
                 echo '=== TCP open to fapi.binance.com:443 (5s timeout) ===' && \
                 docker compose exec -T backend bash -c 'timeout 5 bash -c \"</dev/tcp/fapi.binance.com/443\" && echo TCP_OK_fapi || echo TCP_FAIL_fapi' && \
                 echo '=== HTTPS GET https://fstream.binance.com/ (10s timeout) ===' && \
                 docker compose exec -T backend bash -c 'curl -s -o /dev/null -m 10 -w \"http_code=%{http_code} time=%{time_total}s\\n\" https://fstream.binance.com/'"
              ;;
            pr1-rows-spot-check)
              # READ-ONLY: spot-check most-recent predictions rows for the
              # 7 PR1 analytics columns. Answers "is the aggregator hook
              # populating the new columns?" (V5 verification).
              # Wider 6h window than the operator's 2h spec because the
              # known pre-existing live_worker gap may push the most-recent
              # prediction row back; if 6h shows zero, the issue is the
              # live_worker not writing predictions, not PR1.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== last 10 predictions (any age) — PR1 analytics columns ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT id, symbol, timeframe, ts, \
                       mtf_agreement, mtf_dominant_tf, p_win, \
                       effective_score, realized_vol_20d, \
                       funding_directional_adj \
                     FROM predictions \
                     ORDER BY ts DESC LIMIT 10;\" && \
                 echo '=== prediction count in trailing windows ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT 'last 2h' AS window, count(*) FROM predictions WHERE ts > now() - interval '2 hours' \
                     UNION ALL SELECT 'last 6h', count(*) FROM predictions WHERE ts > now() - interval '6 hours' \
                     UNION ALL SELECT 'last 24h', count(*) FROM predictions WHERE ts > now() - interval '24 hours' \
                     UNION ALL SELECT 'last 7d', count(*) FROM predictions WHERE ts > now() - interval '7 days' \
                     UNION ALL SELECT 'all-time', count(*) FROM predictions;\" && \
                 echo '=== aggregator-hook column coverage (rows with each col non-null) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT \
                       count(*) FILTER (WHERE mtf_agreement IS NOT NULL) AS mtf_agreement_set, \
                       count(*) FILTER (WHERE mtf_dominant_tf IS NOT NULL) AS mtf_dominant_set, \
                       count(*) FILTER (WHERE p_win IS NOT NULL) AS p_win_set, \
                       count(*) FILTER (WHERE effective_score IS NOT NULL) AS effective_score_set, \
                       count(*) FILTER (WHERE realized_vol_20d IS NOT NULL) AS realized_vol_set, \
                       count(*) FILTER (WHERE funding_directional_adj IS NOT NULL) AS funding_adj_set, \
                       count(*) AS total_rows \
                     FROM predictions \
                     WHERE ts > now() - interval '7 days';\" && \
                 echo '=== alembic version ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT version_num FROM alembic_version;\""
              ;;
            live-trade-pnl-verify)
              # READ-ONLY: TIER 1 defect-sweep verification (2026-08-06).
              # Every live_trades row where a close price is KNOWN
              # (exit_price IS NOT NULL) must also have pnl_usdt AND
              # pnl_pct populated — the write path fixed in
              # live_exit_monitor.py + liquidation_monitor.py computes
              # both in the same UPDATE as exit_price, so this can never
              # legitimately diverge. A 100%-coverage assertion query
              # rather than the healer's statistical constant-detector,
              # which needs n>=100 rows to even engage and would stay
              # silent for a long time at real live-trade volume.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== violations: exit_price known but pnl NULL (should be 0 rows) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT id, symbol, direction, exit_reason, exit_price, \
                       pnl_usdt, pnl_pct, closed_at \
                     FROM live_trades \
                     WHERE exit_price IS NOT NULL \
                       AND (pnl_usdt IS NULL OR pnl_pct IS NULL) \
                     ORDER BY closed_at DESC;\" && \
                 echo '=== all closed rows, for context (legacy rows predate this fix) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT id, symbol, status, exit_reason, exit_price, \
                       pnl_usdt, pnl_pct, opened_at, closed_at \
                     FROM live_trades \
                     WHERE status = 'closed' \
                     ORDER BY id;\""
              ;;
            health-summary)
              # One-page production health check: container status,
              # backend health endpoint, the 13-worker watchdog state,
              # recent error count, shadow trade activity, prediction
              # cadence. Designed to be safe to run hourly as a polling
              # monitor — every section bounded so the whole thing
              # finishes in under 30s.
              # Updated 2026-05-11: groups workers by state, treats
              # pending_heartbeat as a separate non-alarming bucket.
              WORKER_SCRIPT=''
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== container ===' && \
                 docker inspect tr-backend --format 'restarts={{.RestartCount}} status={{.State.Status}} started={{.State.StartedAt}}' && \
                 echo '=== backend /api/v1/health ===' && \
                 docker compose exec -T backend curl -s -o /dev/null -m 5 -w 'http_code=%{http_code} time=%{time_total}s\n' http://localhost:8000/api/v1/health && \
                 echo '=== workers (via watchdog check_all_workers) ===' && \
                 timeout 30 docker compose exec -T backend python -c 'import base64; exec(base64.b64decode(\"$WORKER_SCRIPT\").decode())' && \
                 echo '=== errors in last hour ===' && \
                 ERRC=\$(docker compose logs --since=1h backend 2>&1 | grep -ciE 'error|exception|traceback|500 internal' || true) && \
                 echo \"error-like log lines (last 1h): \$ERRC\" && \
                 echo '=== shadow trade activity (last 1h) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT 'open positions' AS k, count(*) FROM shadow_open_positions \
                     UNION ALL SELECT 'closed trades total', count(*) FROM shadow_trades \
                     UNION ALL SELECT 'closed trades last 1h', count(*) FROM shadow_trades WHERE closed_at > now() - interval '1 hour' \
                     UNION ALL SELECT 'opened last 1h (open + closed)', \
                       (SELECT count(*) FROM shadow_open_positions WHERE opened_at > now() - interval '1 hour') + \
                       (SELECT count(*) FROM shadow_trades WHERE opened_at > now() - interval '1 hour');\" && \
                 echo '=== predictions cadence (last 6h) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT date_trunc('hour', ts) AS hour, count(*) AS predictions, \
                       round(max(final_score)::numeric, 3) AS max_score, \
                       round(min(final_score)::numeric, 3) AS min_score \
                     FROM predictions WHERE ts > now() - interval '6 hours' \
                     GROUP BY 1 ORDER BY 1 DESC LIMIT 6;\" && \
                 echo '=== shadow signals fired in last 1h (from logs) ===' && \
                 docker compose logs --since=1h backend 2>&1 | grep -E 'shadow_worker:.*SIGNAL' | tail -10 && \
                 echo '(end)'"
              ;;
            direction-performance)
              # Read-only diagnostic. Answers: "is the model actually
              # directionally accurate, broken down by LONG vs SHORT?"
              # All queries hit prediction_validations (filled by the
              # validator worker added in PR #109) so they require at
              # least one validated row to produce output.
              #
              # The split also surfaces:
              #   - how many SHORT predictions exist at all (the 8 SHORT
              #     predictions historically averaged score=-0.103 — well
              #     above any reasonable SHORT entry gate);
              #   - whether the few SHORT predictions that DO happen are
              #     better/worse than LONG (hit rate + avg pnl_pct);
              #   - threshold-crossing counts for both the old asymmetric
              #     gate (-0.50) and the new symmetric gate (-0.30 from
              #     PR #121) so we know what flipping the threshold would
              #     have changed historically.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '=== prediction_validations — global summary ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT count(*) AS total_rows, \
                       count(*) FILTER (WHERE validated_at IS NOT NULL) AS validated, \
                       count(*) FILTER (WHERE was_correct) AS correct, \
                       round((100.0 * count(*) FILTER (WHERE was_correct) / nullif(count(*) FILTER (WHERE validated_at IS NOT NULL), 0))::numeric, 1) AS accuracy_pct \
                     FROM prediction_validations;\" && \
                 echo '=== accuracy by direction (validated rows only) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT direction, count(*) AS n, \
                       count(*) FILTER (WHERE was_correct) AS correct, \
                       round((100.0 * count(*) FILTER (WHERE was_correct) / nullif(count(*), 0))::numeric, 1) AS accuracy_pct, \
                       round(avg(pnl_pct)::numeric, 4) AS avg_pnl_pct, \
                       round(min(pnl_pct)::numeric, 4) AS worst_pnl, \
                       round(max(pnl_pct)::numeric, 4) AS best_pnl \
                     FROM prediction_validations WHERE validated_at IS NOT NULL \
                     GROUP BY direction ORDER BY direction;\" && \
                 echo '=== score-magnitude buckets per direction (would-be SHORT signal counts) ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT \
                       count(*) AS total_predictions, \
                       count(*) FILTER (WHERE score > 0.30 AND direction = 'LONG') AS long_score_gt_0p30, \
                       count(*) FILTER (WHERE score < -0.50 AND direction = 'SHORT') AS short_score_lt_neg0p50_OLD_GATE, \
                       count(*) FILTER (WHERE score < -0.30 AND direction = 'SHORT') AS short_score_lt_neg0p30_NEW_GATE, \
                       count(*) FILTER (WHERE score < -0.20 AND direction = 'SHORT') AS short_score_lt_neg0p20_LOOSE \
                     FROM prediction_validations;\" && \
                 echo '=== hit rate by direction over last 7 days ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT direction, count(*) AS n, \
                       round((100.0 * count(*) FILTER (WHERE was_correct) / nullif(count(*), 0))::numeric, 1) AS accuracy_pct, \
                       round(avg(pnl_pct)::numeric, 4) AS avg_pnl_pct \
                     FROM prediction_validations \
                     WHERE validated_at IS NOT NULL AND validated_at > now() - interval '7 days' \
                     GROUP BY direction ORDER BY direction;\" && \
                 echo '=== closed shadow trades — actual P&L by direction ===' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"SELECT direction, count(*) AS trades, \
                       count(*) FILTER (WHERE pnl_pct > 0) AS wins, \
                       round((100.0 * count(*) FILTER (WHERE pnl_pct > 0) / nullif(count(*), 0))::numeric, 1) AS win_rate_pct, \
                       round(sum(pnl_usdt)::numeric, 2) AS total_pnl_usdt, \
                       round(avg(pnl_pct)::numeric, 4) AS avg_pnl_pct, \
                       close_reason \
                     FROM shadow_trades WHERE closed_at IS NOT NULL \
                     GROUP BY direction, close_reason ORDER BY direction, close_reason;\""
              ;;
            test-trade-open)
              # Fires the same dispatch the /admin/test-trade/open endpoint
              # would fire, but from inside the backend container so we
              # bypass Cloudflare Access auth. Hard-coded for safety:
              #   use_testnet=True, mode=telegram-approve, BTCUSDT LONG, 20 USDT.
              # The dispatcher sends a Telegram message with Approve/Reject
              # buttons; the operator taps Approve and the existing
              # telegram_poller_task places the order on Binance Futures
              # testnet. No real money can be touched from this code path.
              # Script lives in host-tools/ so the YAML stays clean.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T backend \
                 python /app/host-tools/test_trade_open.py"
              ;;
            test-trade-close-all)
              # Market-close every open position on Binance Futures testnet.
              # Uses BinanceLiveClient with use_testnet=True hard-coded so
              # this code path cannot reach live Binance.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T backend \
                 python /app/host-tools/test_trade_close_all.py"
              ;;
            test-trade-verify-keys)
              # Read-only diagnostic for when test-trade-open succeeds at
              # the dispatch + Telegram layer but the operator's Approve
              # tap fails at the Binance API layer (-2015 etc.). Reports
              # the Hetzner outbound IP, tries the vaulted keys against
              # both testnet and live, prints exactly what to fix.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T backend \
                 python /app/host-tools/test_trade_verify_keys.py"
              ;;
            test-trade-live-round-trip)
              # ⚠ REAL MONEY — places + auto-closes a 0.001 BTC market order
              # on LIVE Binance Futures (~$4 margin, ~$0.06 fees expected).
              # Sizing is a LITERAL in tools/test_trade_live_round_trip.py;
              # this probe takes no parameters. Script auto-closes in its
              # finally block; the test-trade-live-close-all probe is the
              # safety net if even that fails.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T backend \
                 python /app/host-tools/test_trade_live_round_trip.py"
              ;;
            test-trade-live-close-all)
              # Safety-net flatten for the live round-trip. Closes any
              # open BTCUSDT / ETHUSDT position on LIVE Binance.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && docker compose exec -T backend \
                 python /app/host-tools/test_trade_live_close_all.py"
              ;;
            enable-live-telegram-approve)
              # ⚠ ENABLES autonomous trading on REAL money. Three changes
              # in one atomic probe:
              #   1. UPDATE users SET trading_mode='telegram-approve',
              #      fixed_size_min_usdt=5, fixed_size_max_usdt=10 WHERE id=1
              #      (bypasses the promotion gates — testnet path already
              #       validated, operator explicitly authorized)
              #   2. sed BINANCE_USE_TESTNET=false in /opt/trading-radar/.env
              #      (orders now route to LIVE Binance)
              #   3. docker compose restart backend (reload env + re-init
              #      vault + recreate binance_factory)
              # Reverts via the disable-live-telegram-approve probe.
              ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
                "cd $DIR_DEFAULTED && \
                 echo '--- 1/4 backing up .env ---' && \
                 cp .env .env.bak.\$(date +%s) && \
                 echo '--- 2/4 setting BINANCE_USE_TESTNET=false ---' && \
                 if grep -q '^BINANCE_USE_TESTNET=' .env; then \
                   sed -i 's/^BINANCE_USE_TESTNET=.*/BINANCE_USE_TESTNET=false/' .env; \
                 else \
                   echo 'BINANCE_USE_TESTNET=false' >> .env; \
                 fi && \
                 grep '^BINANCE_USE_TESTNET=' .env && \
                 echo '--- 3/4 DB: mode=telegram-approve, size=5-10 USDT ---' && \
                 docker compose exec -T postgres psql -U postgres -d trading_radar -c \
                   \"UPDATE users SET trading_mode='telegram-approve', \
                        fixed_size_min_usdt=5, fixed_size_max_usdt=10 WHERE id=1 \
                     RETURNING id, trading_mode, fixed_size_min_usdt, fixed_size_max_usdt;\" && \
                 echo '--- 4/4 restarting backend ---' && \
                 docker compose up -d --build && \
