name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: trading_radar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install aiosqlite==0.20.0 respx==0.22.0
      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          mypy app
      - name: Unit + integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:testpw@localhost:5432/trading_radar
          REDIS_URL: redis://localhost:6379/0
          ENV: development
          # SP-9: lifespan starts background workers when env != test/ci. The
          # news ingest worker fires immediately and tries to reach CryptoPanic +
          # Yahoo RSS + alternative.me — outbound HTTPS hangs in CI. Keep
          # ENV=development for the cf-access dev bypass + DB pool config, but
          # disable workers so tests don't pile up on outbound network calls.
          WORKER_ENABLED: "false"
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install + lint + test
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
