name: ci

on:
  pull_request:
  push:
    branches: [main]

# Auto-cancel an in-progress run when a newer commit lands on the same ref.
# Without this, a pytest-hung run can sit for the full 6h job timeout while
# the fix commit's run queues behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: trading_radar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install aiosqlite==0.20.0 respx==0.22.0
      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          mypy app
      - name: Unit + integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:testpw@localhost:5432/trading_radar
          REDIS_URL: redis://localhost:6379/0
          ENV: development
          # SP-9: lifespan starts background workers when env != test/ci. The
          # news ingest worker fires immediately and tries to reach CryptoPanic +
          # Yahoo RSS + alternative.me — outbound HTTPS hangs in CI. Keep
          # ENV=development for the cf-access dev bypass + DB pool config, but
          # disable workers so tests don't pile up on outbound network calls.
          WORKER_ENABLED: "false"
        # 120s per-test timeout: most tests run in <1s, the slowest legitimate
        # ones (rate-limit timing tests, freezegun-backed integration flows)
        # take a few seconds. 120s catches genuine hangs while leaving headroom
        # for CI runners under load.
        run: pytest -v --timeout=120 --timeout-method=thread

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install + lint + test
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  # docker-compose smoke test — boots the entire stack with the real
  # docker-compose.yml and verifies the backend reaches a healthy state
  # without crash-restarting. Catches the class of bugs unit tests miss:
  #
  # - Bind mount paths that shadow image-built packages
  #   (PR #47: ./tools:/app/tools shadowed /app/tools/backtest, kept the
  #    backend in a ModuleNotFoundError crash-restart loop in production)
  # - Module imports that break only when actually loaded by uvicorn
  # - Postgres-strict SQL errors that pass against SQLite (PR #45 bool=int,
  #   PR #46 datetime-as-string, PR #49 adapter_health bool — all shipped
  #   broken because the unit tests use SQLite)
  #
  # Adds ~3-5 min to CI per push but is worth it given the cost of a prod
  # crash-loop incident (last one took half a day to chase down).
  docker-compose-smoke:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Write smoke .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=smokepw
          POSTGRES_DB=trading_radar
          DATABASE_URL=postgresql+asyncpg://postgres:smokepw@postgres:5432/trading_radar
          REDIS_URL=redis://redis:6379/0
          ENV=ci
          LOG_LEVEL=INFO
          CF_ACCESS_TEAM_DOMAIN=
          CF_ACCESS_AUD=
          BINANCE_USE_TESTNET=true
          MASTER_PASSPHRASE=smoketest-master-passphrase-do-not-use-in-prod
          BACKUP_ENCRYPTION_KEY=smoketest-backup-key
          GRAFANA_ADMIN_PASSWORD=smokeonly
          EOF
      - name: Build + start backend, postgres, redis
        run: |
          docker compose up -d --build postgres redis backend
      - name: Wait for backend healthy (max 90s)
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker inspect tr-backend --format '{{.State.Health.Status}}' 2>/dev/null || echo "missing")
            RESTARTS=$(docker inspect tr-backend --format '{{.RestartCount}}' 2>/dev/null || echo "?")
            echo "[t+${i}x3s] health=$STATUS restarts=$RESTARTS"
            if [ "$STATUS" = "healthy" ]; then
              echo "✓ backend healthy after ${i}x3s"
              exit 0
            fi
            if [ "$RESTARTS" -gt 0 ] 2>/dev/null; then
              echo "✗ backend restarted (RestartCount=$RESTARTS) — likely an import or startup error"
              docker compose logs --tail=50 backend
              exit 1
            fi
            sleep 3
          done
          echo "✗ backend did not reach healthy in 90s"
          docker compose logs --tail=80 backend
          exit 1
      - name: Verify imports the previous regression hit
        run: |
          # PR #47 regression guard: /app/tools/backtest.py must import.
          docker exec tr-backend python -c "import tools.backtest; print('tools.backtest:', tools.backtest.__file__)"
          # The bind-mounted host-tools must also be visible (not shadowed).
          docker exec tr-backend test -d /app/host-tools/ml
      - name: Verify /api/v1/health returns 200
        run: |
          docker exec tr-backend curl -fsS http://localhost:8000/api/v1/health
      - name: Tail logs for any startup warnings
        if: always()
        run: docker compose logs --tail=80 backend
      - name: Tear down
        if: always()
        run: docker compose down -v

  # SP-9: Playwright e2e smoke. Boots Vite + a Playwright Chromium probe
  # against mocked /api/v1/* responses, drives every clickable on every
  # tab, and fails on any uncaught console error or page-error event.
  # The mocks live in tests/e2e/mock-fixtures.mjs so the test is fast
  # and self-contained — no need for the docker stack to be up.
  #
  # Catches the class of bugs unit tests miss:
  # - useEffect cleanup races (TVChart disposal-order bug)
  # - Tab-mount data fetches that throw on edge-case payload shapes
  # - Keyboard navigation regressions
  # - Symbol-search debounce + commit flow
  playwright-e2e:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend bundle (catches type errors)
        working-directory: frontend
        run: npm run build
      - name: Start Vite preview server (background)
        working-directory: frontend
        run: |
          nohup npx vite preview --host 127.0.0.1 --port 5173 > vite.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then
              echo "Vite preview up after ${i}x1s"
              break
            fi
            sleep 1
          done
      - name: Run Playwright e2e (backend-free specs)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        # The existing tests/e2e/{admin-users,bot-status,tab3-scanner}.spec.ts
        # files were written when a dev backend was always running locally.
        # In CI we only have a static Vite preview, so they timeout looking
        # for backend-driven UI (e.g. Admin tab only appears when /me
        # returns is_admin=true). Run only the truly self-contained specs
        # that exercise routing + autonomous tab rendering without backend
        # data dependencies. The full suite still runs locally via
        # `npm run test:e2e` when the dev stack is up.
        run: |
          npx playwright test --reporter=list \
            tests/e2e/tracer-bullet.spec.ts \
            tests/e2e/mobile-responsive.spec.ts \
            tests/e2e/autonomous.spec.ts
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
