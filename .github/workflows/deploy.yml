name: deploy

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/workflows/ops-debug.yml"
  workflow_dispatch:

# Two parallel deploy paths:
#   main branch -> production (aji12.nagayuaj.com, port 5173/8000)
#   dev  branch -> staging    (staging.aji12.nagayuaj.com, port 5174/8001)
#
# Same Hetzner box, separate docker-compose stacks, separate volumes,
# separate Postgres database. Staging hard-OFF for autonomous trading
# regardless of .env contents (compose env override).
#
# paths-ignore (2026-08-30): before this, EVERY push to main/dev
# deployed -- no path filter existed, so a pure ops-debug.yml or *.md
# change restarted the live backend (~25-30s real WS outage on prod)
# with zero behavior change to justify it. Discovered when merging
# PR #529 (an ops-debug.yml-only probe addition, believed inert)
# silently triggered a real prod restart that collided with a 15m
# candle boundary. This list is deliberately conservative and uses
# an ignore-list, NOT an allow-list: an allow-list that misses a real
# code path silently stops deploying actual changes, which is a far
# worse failure mode than one extra harmless deploy. Only add entries
# here that are provably inert to the running backend/frontend --
# when in doubt, leave it deploying. Do NOT add `.github/workflows/**`
# wholesale: deploy.yml and ci.yml themselves, and any future
# workflow that touches runtime behavior, must keep deploying.
#
# Concurrency guard (added 2026-08-07 after a real incident): merging
# multiple PRs within seconds of each other fired multiple `docker
# compose up -d --build` runs against the SAME container name
# concurrently -- one run's `Recreate` raced another's `Stop`, leaving
# tr-backend deleted with neither run completing ("Error when
# allocating new name: Conflict" / "No such container"). Prod was down
# with no backend container until the next run was manually retried.
# `cancel-in-progress: false` queues instead of killing a mid-flight
# deploy (which could itself leave a worse partial state); GitHub only
# keeps the single most-recently-queued run per group, so a burst of
# pushes always converges on one clean deploy of the latest code, not
# a pile of racing ones. Grouped per-ref so main (prod) and dev
# (staging) deploys never block each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      HETZNER_INSTALL_DIR: ${{ secrets.HETZNER_INSTALL_DIR }}
    steps:
      - name: Guard — required secrets present
        run: |
          if [ -z "$HETZNER_HOST" ]; then
            echo "::warning::HETZNER_HOST secret not set; skipping deploy."
            echo "Add repo secrets HETZNER_HOST + HETZNER_SSH_KEY to enable auto-deploy."
            exit 0
          fi
        id: guard

      - name: Set up SSH
        if: env.HETZNER_HOST != ''
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production (main branch)
        if: github.ref == 'refs/heads/main' && env.HETZNER_HOST != ''
        run: |
          USER_DEFAULTED="${HETZNER_USER:-root}"
          DIR_DEFAULTED="${HETZNER_INSTALL_DIR:-/opt/trading-radar}"
          ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
            "cd $DIR_DEFAULTED && \
             git fetch --all && \
             git checkout main && \
             git reset --hard origin/main && \
             docker compose up -d --build && \
             docker compose exec -T backend alembic upgrade head && \
             echo 'waiting 15s for backend to bind port 8000…' && \
             sleep 15 && \
             curl -fsS --retry 5 --retry-delay 3 --retry-connrefused \
                  http://localhost:8000/api/v1/health && \
             echo '--- populating universe_history (idempotent) ---' && \
             ( docker compose exec -T backend \
                 python /app/host-tools/populate_universe_history.py || true ) && \
             echo '--- installing brain-trainer nightly cron (idempotent) ---' && \
             ( crontab -l 2>/dev/null | grep -v -F 'hetzner_brain_cron.sh' ; \
               echo '30 3 * * * /opt/trading-radar/backend/scripts/hetzner_brain_cron.sh >> /var/log/trading-radar-brain-cron.log 2>&1' ) | crontab - && \
             crontab -l | grep -F 'hetzner_brain_cron.sh' && \
             echo '--- installing self-healing watchdog cron (idempotent) ---' && \
             chmod +x /opt/trading-radar/scripts/watchdog.sh && \
             ( crontab -l 2>/dev/null | grep -v -F '/opt/trading-radar/scripts/watchdog.sh' ; \
               echo '*/15 * * * * INSTALL_DIR=/opt/trading-radar /opt/trading-radar/scripts/watchdog.sh >> /var/log/trading-radar-watchdog.log 2>&1' ) | crontab - && \
             crontab -l | grep -F '/opt/trading-radar/scripts/watchdog.sh' && \
             echo '--- installing daily Postgres backup cron (idempotent) ---' && \
             chmod +x /opt/trading-radar/scripts/backup.sh /opt/trading-radar/scripts/restore_backup.sh && \
             touch /var/log/trading-radar-backup.log && \
             mkdir -p /var/backups/trading-radar && \
             ( crontab -l 2>/dev/null | grep -v -F '/opt/trading-radar/scripts/backup.sh' ; \
               echo '15 3 * * * /opt/trading-radar/scripts/backup.sh >> /var/log/trading-radar-backup.log 2>&1' ) | crontab - && \
             crontab -l | grep -F '/opt/trading-radar/scripts/backup.sh' && \
             echo '--- recent backend logs (last 30 lines) ---' && \
             docker compose logs --tail=30 backend"

      - name: Deploy staging (dev branch)
        if: github.ref == 'refs/heads/dev' && env.HETZNER_HOST != ''
        run: |
          USER_DEFAULTED="${HETZNER_USER:-root}"
          # Staging deploys to /opt/trading-radar-staging (separate
          # checkout so a corrupted dev branch can never overwrite the
          # prod git tree).
          DIR_DEFAULTED="${HETZNER_INSTALL_DIR:-/opt/trading-radar}-staging"
          # First-deploy bootstrap: clone if absent.
          ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
            "if [ ! -d $DIR_DEFAULTED/.git ]; then \
               git clone https://github.com/naga1412/v5_Trade_bot.git $DIR_DEFAULTED && \
               cd $DIR_DEFAULTED && \
               cp .env.staging.example .env.staging && \
               echo '⚠ Edit $DIR_DEFAULTED/.env.staging with real values then re-deploy'; \
             fi"
          ssh -i ~/.ssh/hetzner_key "$USER_DEFAULTED@$HETZNER_HOST" \
            "cd $DIR_DEFAULTED && \
             git fetch --all && \
             git checkout dev && \
             git reset --hard origin/dev && \
             docker compose -f docker-compose.staging.yml --env-file .env.staging \
                 up -d --build && \
             docker compose -f docker-compose.staging.yml --env-file .env.staging \
                 exec -T backend-staging alembic upgrade head && \
             echo 'waiting 15s for staging backend to bind port 8001…' && \
             sleep 15 && \
             curl -fsS --retry 5 --retry-delay 3 --retry-connrefused \
                  http://localhost:8001/api/v1/health && \
             echo '--- staging populate ---' && \
             ( docker compose -f docker-compose.staging.yml --env-file .env.staging \
                 exec -T backend-staging \
                 python /app/host-tools/populate_universe_history.py || true ) && \
             echo '--- staging backend logs ---' && \
             docker compose -f docker-compose.staging.yml --env-file .env.staging \
                 logs --tail=30 backend-staging"
