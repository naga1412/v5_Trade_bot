services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: tr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "synchronous_commit=on"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tr-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 1500mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tr-backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      BINANCE_USE_TESTNET: ${BINANCE_USE_TESTNET}
      MASTER_PASSPHRASE: ${MASTER_PASSPHRASE}
    volumes:
      # SP-1.1 / SP-4 — bind-mount checkpoint caches so SCP'd .pt files
      # survive container restarts. The lifespan loader (app/main.py)
      # calls load_active_checkpoint() at startup, which resolves
      # file:///app/data/ml-cache/<name>.pt against this mount. Without
      # the mount the .pt is wiped every restart and the loader fails.
      # Read-only inside the container — the operator SCPs to the host
      # path /opt/trading-radar/backend/data/{ml,rl}-cache/ and
      # register.py records the file:// URI.
      - ./backend/data/ml-cache:/app/data/ml-cache:ro
      - ./backend/data/rl-cache:/app/data/rl-cache:ro
      # SP-1.1 — bind-mount tools/ so register.py + future operator
      # scripts are runnable inside the container via
      # `docker compose exec backend python /app/tools/ml/register.py`
      # without rebuilding the image. Read-only.
      - ./tools:/app/tools:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: tr-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_URL: /api/v1
      VITE_WS_URL: /ws/v1

  # SP-7 Phase F: monitoring stack (Prometheus + Grafana + Loki + Promtail).
  # Operator brings these up on demand: `docker compose up -d prometheus grafana loki promtail`.
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: tr-prometheus
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: tr-grafana
    restart: unless-stopped
    depends_on: [prometheus, loki]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:3.2.0
    container_name: tr-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
    command: -config.file=/etc/loki/loki.yml

  promtail:
    image: grafana/promtail:3.2.0
    container_name: tr-promtail
    restart: unless-stopped
    depends_on: [loki]
    volumes:
      - /var/log:/var/log:ro
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
    command: -config.file=/etc/promtail/promtail.yml

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: trading-radar
