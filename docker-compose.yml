services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: tr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "synchronous_commit=on"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tr-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 1500mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tr-backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    # PR-FIX-FLAG-BINDING (2026-05-22): inject the full host .env into the
    # backend container so pydantic-settings can bind UPPERCASE strategy
    # flags (DISABLE_SHORT_SIGNALS, MIN_ENTRY_SCORE_LONG, SYMBOL_ALLOWLIST_ENABLED,
    # DYNAMIC_SIZING_ENABLED, LIVE_COOLDOWN_ENABLED, MTF_MIN_AGREEMENT_1H, …).
    # Pre-fix, the explicit `environment:` allowlist below was the ONLY
    # channel — flags not enumerated here silently fell back to defaults
    # regardless of what the operator put in .env. Discovered when the
    # 2026-05-21 DISABLE_SHORT_SIGNALS flip didn't take effect (verify
    # probe run 26249116921). The explicit entries below remain because
    # `environment:` takes precedence over `env_file:` when both set the
    # same key, preserving the YAML-interpolation defaults (`:-false`) for
    # vars that are core deploy infrastructure.
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ENV: ${ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD}
      BINANCE_USE_TESTNET: ${BINANCE_USE_TESTNET}
      MASTER_PASSPHRASE: ${MASTER_PASSPHRASE}
      # SP-8 Phase J: autonomous trading. Listed explicitly so the
      # `:-false` default applies when the var is missing from .env.
      AUTONOMOUS_TRADING_ENABLED: ${AUTONOMOUS_TRADING_ENABLED:-false}
      AUTO_PROMOTE_TO_TELEGRAM_ENABLED: ${AUTO_PROMOTE_TO_TELEGRAM_ENABLED:-false}
      AUTO_PROMOTE_TO_FULLYAUTO_ENABLED: ${AUTO_PROMOTE_TO_FULLYAUTO_ENABLED:-false}
      AUTO_PROMOTE_CONSECUTIVE_DAYS: ${AUTO_PROMOTE_CONSECUTIVE_DAYS:-7}
      WORKER_ENABLED: ${WORKER_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://localhost:8000}
    volumes:
      # SP-1.1 / SP-4 — bind-mount checkpoint caches so SCP'd .pt files
      # survive container restarts. The lifespan loader (app/main.py)
      # calls load_active_checkpoint() at startup, which resolves
      # file:///app/data/ml-cache/<name>.pt against this mount. Without
      # the mount the .pt is wiped every restart and the loader fails.
      # ml-cache is read-only — operator SCPs to the host path
      # /opt/trading-radar/backend/data/ml-cache/ and register.py records
      # the file:// URI.
      # rl-cache is READ-WRITE (PR-BRAIN-BOOTSTRAP-FIX): the brain
      # trainer cron (backend/scripts/hetzner_brain_cron.sh) both READS
      # warm-start .pt files AND WRITES new checkpoint .pt files to this
      # same directory. A :ro mount makes the write fail with
      # `Read-only file system`.
      - ./backend/data/ml-cache:/app/data/ml-cache:ro
      - ./backend/data/rl-cache:/app/data/rl-cache
      # SP-1.1 — bind-mount the REPO-ROOT tools/ at /app/host-tools (NOT
      # /app/tools — that path is owned by the image's COPY of
      # backend/tools/{backtest,ml,...} which app/api/routes/admin_backtest.py
      # imports via `from tools.backtest import ...`). Mounting at
      # /app/tools shadows the package and breaks `from tools.backtest`
      # at startup (production crash-restart loop). Mounting at
      # /app/host-tools keeps both available. Operator activation flow:
      #     docker compose exec backend python \
      #         /app/host-tools/ml/register.py --checkpoint ... --activate --force
      - ./tools:/app/host-tools:ro
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: tr-frontend
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_URL: /api/v1
      VITE_WS_URL: /ws/v1

  # SP-7 Phase F: monitoring stack (Prometheus + Grafana + Loki + Promtail).
  # Operator brings these up on demand: `docker compose up -d prometheus grafana loki promtail`.
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: tr-prometheus
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: tr-grafana
    restart: unless-stopped
    depends_on: [prometheus, loki]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:3.2.0
    container_name: tr-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
    command: -config.file=/etc/loki/loki.yml

  promtail:
    image: grafana/promtail:3.2.0
    container_name: tr-promtail
    restart: unless-stopped
    depends_on: [loki]
    volumes:
      - /var/log:/var/log:ro
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
    command: -config.file=/etc/promtail/promtail.yml

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: trading-radar
