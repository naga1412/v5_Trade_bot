[project]
name = "trading-radar-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "httpx==0.28.1",
    "websockets==13.1",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "ccxt==4.4.40",
    "PyJWT[crypto]==2.10.1",
    "structlog==24.4.0",
    "cryptography==46.0.7",
    "pyotp==2.9.0",
    "torch==2.4.1",
    "pyarrow==17.0.0",
    "boto3==1.35.0",
    "duckdb==1.1.3",
    "ta-lib==0.6.5",
    "scipy==1.13.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Pre-existing CI break on `main`: setuptools auto-discovery sees
# ``app/``, ``data/``, ``alembic/`` as three top-level packages and refuses
# to build the editable install. Restrict discovery to ``app*`` only —
# ``alembic/versions`` and ``data/`` are runtime resources, not import roots.
include = ["app*"]
exclude = ["data*", "alembic*", "tests*", "tools*"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "anyio==4.7.0",
    "freezegun==1.5.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "aiosqlite==0.20.0",
    "respx==0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --cov-fail-under is intentionally NOT in default addopts: it should only run
# as an aggregate CI check at PR time (via `pytest --cov-fail-under=85`),
# not on every per-phase run while modules are still being added.
addopts = "-ra -q --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "integration: requires database/redis",
    "slow: takes more than 1s",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
