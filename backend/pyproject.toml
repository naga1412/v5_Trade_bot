[project]
name = "trading-radar-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "redis==5.2.1",
    "httpx==0.28.1",
    "websockets==13.1",
    "numpy==1.26.4",
    "pandas==2.2.3",
    "ccxt==4.4.40",
    "pybit==5.7.0",
    "PyJWT[crypto]==2.10.1",
    "structlog==24.4.0",
    "cryptography==46.0.7",
    "pyotp==2.9.0",
    "torch==2.4.1",
    "pyarrow==17.0.0",
    "boto3==1.35.0",
    "duckdb==1.1.3",
    "ta-lib==0.6.5",
    "scipy==1.13.1",
    "yfinance==0.2.40",
    # SP-7 Phase A3: ops hardening runtime deps.
    # - optuna: Bayesian search runner for the SP-7 hyperopt loop (§6.10).
    # - prometheus-fastapi-instrumentator: thin wrapper around prometheus-client
    #   wired into app.main in Phase F4.
    # NOTE on freqtrade==2024.10: deferred. The pinned release transitively
    # requires `pandas-ta`, which has no PyPI wheel for the project's python
    # range (>=3.11,<3.12) — pandas-ta only publishes >=3.12 prereleases.
    # Pinning freqtrade==2024.10 makes `pip install -e .` fail with
    # `ERROR: No matching distribution found for pandas-ta`. Per the SP-7
    # plan's documented fallback path, Phase B will implement the backtest
    # runner natively against the existing OHLCV → build_prediction → SL/TP
    # simulator pipeline (which we already need anyway — freqtrade's data
    # ingestion model assumes its own SQLite DB), and freqtrade can be
    # revisited once pandas-ta ships a 3.11 wheel or we move to py3.12.
    "optuna==4.0.0",
    "prometheus-fastapi-instrumentator==7.0.0",
    # SP-9 Phase A3: news + sentiment runtime deps.
    # - transformers: HuggingFace inference for ProsusAI/finbert (CPU only).
    # - feedparser: RSS 2.0 / Atom 1.0 parsing for Yahoo RSS macro feeds.
    # First run downloads FinBERT (~440MB) to ~/.cache/huggingface; cached after.
    "transformers==4.46.0",
    "feedparser==6.0.11",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Pre-existing CI break on `main`: setuptools auto-discovery sees
# ``app/``, ``data/``, ``alembic/`` as three top-level packages and refuses
# to build the editable install. Restrict discovery to ``app*`` only —
# ``alembic/versions`` and ``data/`` are runtime resources, not import roots.
include = ["app*"]
exclude = ["data*", "alembic*", "tests*", "tools*"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "anyio==4.7.0",
    "freezegun==1.5.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "aiosqlite==0.20.0",
    "respx==0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --cov-fail-under is intentionally NOT in default addopts: it should only run
# as an aggregate CI check at PR time (via `pytest --cov-fail-under=85`),
# not on every per-phase run while modules are still being added.
addopts = "-ra -q --strict-markers --cov=app --cov-report=term-missing"
markers = [
    "integration: requires database/redis",
    "slow: takes more than 1s",
]

[tool.ruff]
# Colab notebooks are interactive scratch space — semicolon chains, multi-imports,
# and other "loose" Jupyter idioms shouldn't trip the strict lint we apply to .py.
extend-exclude = ["tools/ml/colab/*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# Tests routinely interleave imports with fixtures / pytest.importorskip checks,
# and dead local assignments are common in arrange-act-assert blocks.
"tests/**/*.py" = ["E402", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
